@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/font/is-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Instrument Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/font/is-latinext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(/assets/font/br-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(/assets/font/br-latinext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
*{box-sizing:border-box}
/* The room wears the product's colours, not the site's — the same rule the
   phone room follows with ALTI's navy. Jotform's panel is navy and blue, and
   its two gauges run blue→purple, so that ramp is the room's accent. A coral
   room around a blue product read as somebody else's page. */
:root{
  --ink:#0A1551; --ink-2:#040A1E;
  --paper:#EAF0FF; --dim:#7C89B4;
  --blue:#1FA0FD; --purple:#9B4DD8;
  --ramp:linear-gradient(96deg,#1FA0FD,#9B4DD8);
}
html,body{height:100%}
body{
  margin:0; background:var(--ink-2); color:var(--paper);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
  /* the product's own light: blue low on the left, a little purple high on the
     right — the two colours its gauges are drawn in, so the monitor stands in
     front of something that belongs to it */
  background-image:
    radial-gradient(112% 82% at 12% 104%, rgba(31,160,253,.22), rgba(4,10,30,0) 62%),
    radial-gradient(84% 72% at 90% -8%, rgba(155,77,216,.18), rgba(4,10,30,0) 60%);
  background-attachment:fixed;
}
a{color:inherit}

/* THE SITE'S OWN NAV, not a bar invented for this room — same shape, same
   type, same order, carried into the dark the way body.case-open carries it
   on a case study. The section links are absolute because this is a separate
   address. */
nav{
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  z-index:50; display:flex; align-items:center; gap:6px;
  padding:7px 8px 7px 18px; border-radius:16px;
  background:rgba(16,28,72,.72); backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 24px rgba(0,0,0,.42);
}
nav .mark{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:15px;
  letter-spacing:-.02em;margin-right:14px;color:#fff;text-decoration:none;
  transition:opacity .25s ease}
nav a.mark:hover{opacity:.6}
nav .mark i{color:var(--blue);font-style:normal}
nav a{font-size:11px;letter-spacing:.01em;color:#AEBBE4;text-decoration:none;
  padding:8px 12px;border-radius:10px;transition:background .25s ease,color .25s ease}
nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.lang{display:flex;gap:2px;margin-left:8px;padding:3px;border-radius:11px;background:rgba(255,255,255,.08)}
.lang button{font-family:inherit;font-size:12.5px;border:0;cursor:pointer;padding:5px 9px;
  border-radius:8px;background:transparent;color:var(--dim);
  transition:.3s cubic-bezier(.34,1.4,.5,1)}
.lang button.on{background:#fff;color:var(--ink)}

/* ---- the desk ----
   Three columns, the same shape as the phone room: the words on the left, the
   controls on the right, and the middle left to the object. Stacking them
   under the monitor cost it height on every screen and gave the page a column
   of equal-weight things instead of one machine to look at. */
main{flex:1 1 auto;min-height:0;display:grid;
  grid-template-columns:minmax(230px,30ch) auto;align-items:center;
  justify-content:center;gap:clamp(24px,4vw,64px);padding:84px 22px 10px}
.side{max-width:34ch}
.room h1{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;
  font-size:clamp(25px,2.6vw,34px);letter-spacing:-.025em;line-height:1.08}
.room span{display:block;margin-top:12px;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.hint{margin:22px 0 26px;font-size:15px;line-height:1.72;color:#A7B3D8}
.hint b{color:#fff;font-weight:600}
.rig{display:flex;flex-direction:column;align-items:center}
/* dark aluminium, a hair lighter along the top edge where the light lands */
.mon{position:relative;padding:14px 14px 30px;border-radius:20px;
  background:linear-gradient(#33363F,#1C1E24 22%,#16181D);
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset, 0 0 0 1px #0A0B0E,
             0 40px 70px -28px rgba(0,0,0,.85), 0 8px 24px rgba(0,0,0,.5)}
.mon:after{content:'';position:absolute;left:50%;bottom:13px;width:5px;height:5px;
  margin-left:-2.5px;border-radius:50%;background:#5EE38A;
  box-shadow:0 0 8px rgba(94,227,138,.75)}
/* the screen is cut to the frame's own 1440x900 and sized against whatever the
   nav, the stand and the two side columns leave — in CSS, because the middle
   column of a `1fr auto 1fr` grid is measured *from* this box, so asking JS
   for the space first would be asking it to measure itself */
.screen{position:relative;border-radius:7px;overflow:hidden;background:#F0F0F1;
  box-shadow:0 0 0 1px rgba(0,0,0,.55) inset;
  aspect-ratio:1440/900;
  height:min(900px, calc(100dvh - 300px), calc((100vw - 470px) * .625));}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  opacity:0;transition:opacity .5s ease}
.screen iframe.ready{opacity:1}
/* full screen: the box drops its ratio and its ceiling and takes the window.
   The player is already `scale-down-width`, so it fills the width and lands
   the frame's own height — the same picture, larger. */
.screen:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;
  border-radius:0;background:var(--ink-2);box-shadow:none}
.screen:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0}

/* the player takes a few seconds and shows white while it does; the room
   holds a dark card over it until the frame reports back */
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:#0B1330;color:var(--dim);font-size:13px;
  transition:opacity .45s ease}
.wait.gone{opacity:0;pointer-events:none}
.wait .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.wait .bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--ramp);
  animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(255%)}}
.neck{width:118px;height:52px;background:linear-gradient(90deg,#1A1C22,#2A2D35 42%,#15171C);
  clip-path:polygon(24% 0,76% 0,100% 100%,0 100%)}
.foot{width:280px;height:16px;border-radius:0 0 14px 14px;
  background:linear-gradient(#2A2D35,#15171C);box-shadow:0 22px 34px -18px rgba(0,0,0,.9)}

/* THE ACTIONS, in the site's own two weights — `.demo-btn` from a case study
   and `.go`/`.quiet` from the phone room, to the pixel: same pill, same
   14.5px, same 14/22, same ramp, same spring lift. The secondary is NOT an
   outlined copy of the primary; an outline-only control is on the list of
   tells to keep off this site. The filled one is *Start over*, because in a
   room built around a prototype the thing to press is the prototype again. */
.acts{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.go{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;
  font-family:inherit;font-size:14.5px;color:#fff;background-image:var(--ramp);border:0;
  padding:14px 22px;border-radius:999px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(31,160,253,.30);
  transition:transform .45s cubic-bezier(.34,1.4,.5,1),box-shadow .3s ease;
}
.go:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(31,160,253,.42)}
.quiet{
  display:inline-flex;align-items:center;gap:11px;text-decoration:none;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:var(--dim);
  border:0;background:none;padding:9px 10px 9px 0;border-radius:10px;
  transition:color .2s ease;
}
.quiet:hover{color:#fff}
.acts svg{width:15px;height:15px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .3s cubic-bezier(.34,1.4,.5,1)}
.quiet:hover svg{transform:translateX(2px)}
.go:hover svg{transform:rotate(-40deg)}
.foot-note{margin:22px 0 0;max-width:52ch;font-size:12.5px;line-height:1.6;
  color:#67739C;text-align:center}

@media (max-width:1100px){
  body{overflow:auto}
  main{grid-template-columns:1fr;justify-items:center;text-align:center;
    padding:74px 12px 10px;gap:22px}
  .side{max-width:46ch}
  .acts{align-items:center}
  .screen{height:min(900px, calc(100dvh - 300px), calc((100vw - 48px) * .625))}
  .mon{padding:9px 9px 20px;border-radius:14px}
}
@media (max-width:640px){
  .mon{padding:6px 6px 6px;border-radius:11px}
  .mon:after,.neck,.foot{display:none}
  nav{top:10px;padding-left:14px} nav a{padding:8px 9px}
}
</style>

<body>

<nav>
  <a class="mark" href="https://elifbeyzauysal.com/" aria-label="Elif Uysal — home">elif<i>.</i></a>
  <a href="https://elifbeyzauysal.com/#work" data-i18n="work">Work</a>
  <a href="https://elifbeyzauysal.com/cv/" data-i18n="about">About</a>
  <a href="https://elifbeyzauysal.com/#contact" data-i18n="contact">Contact</a>
  <span class="lang"><button data-lang="en" class="on">EN</button><button data-lang="tr">TR</button></span>
</nav>

<main>
  <div class="side">
    <div class="room">
      <h1>Chatbot Dashboard</h1>
      <span data-i18n="sub">Jotform &middot; inside WordPress</span>
    </div>
    <p class="hint" data-i18n-html="hint"></p>
    <p class="acts">
      <button class="go" type="button" id="restart">
        <span data-i18n="restart">Start over</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/></svg></button>
      <button class="quiet" type="button" id="full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-7 7"/><path d="M10 20H4v-6"/><path d="M4 20l7-7"/></svg>
        <span data-i18n="full">Full screen</span></button>
      <a class="quiet" href="https://elifbeyzauysal.com/#work">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
        <span data-i18n="more">See more work</span></a>
    </p>
  </div>

  <div class="rig">
    <div class="mon">
      <div class="screen" id="screen">
        <iframe id="proto" src="https://embed.figma.com/proto/2x6KiLkwK5G2oheLZrzSaS/Jotform?node-id=1384-158976&page-id=930%3A24958&starting-point-node-id=1384%3A146915&scaling=scale-down-width&content-scaling=fixed&hide-ui=1&embed-host=elifbeyzauysal" title="Chatbot Dashboard — prototype"
                allowfullscreen loading="eager"></iframe>
        <div class="wait" id="wait">
          <span data-i18n="loading">Loading the prototype</span>
          <span class="bar"><i></i></span>
        </div>
      </div>
    </div>
    <div class="neck"></div>
    <div class="foot"></div>
    <p class="foot-note" data-i18n-html="foot"></p>
  </div>
</main>

<script>
(function(){
  var proto=document.getElementById('proto'), wait=document.getElementById('wait'),
      box=document.getElementById('screen');
  /* The frame's `load` fires long before the player has painted, and a card
     lifted at a fixed delay showed a white screen on a slow line. Figma's
     embed posts to the parent when it is actually up, so the card waits for
     that and only falls back to a timer if the message never comes. */
  var shown = false;
  function reveal(){
    if(shown) return; shown = true;
    proto.classList.add('ready'); wait.classList.add('gone');
  }
  addEventListener('message', function(e){
    if(typeof e.origin !== 'string' || e.origin.indexOf('figma.com') < 0) return;
    var t = e.data && e.data.type;
    if(t === 'INITIAL_LOAD' || t === 'PRESENTED_NODE_CHANGED') reveal();
  });
  proto.addEventListener('load', function(){ setTimeout(reveal, 6000); });

  /* Full screen is the screen's, not the page's: the monitor is scenery, and
     what someone wants larger is the prototype. Escape is the browser's, so
     the label follows the state rather than the click. */
  var full = document.getElementById('full'),
      fullLabel = full.querySelector('span');
  full.addEventListener('click', function(){
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var go = box.requestFullscreen || box.webkitRequestFullscreen;
      if(go) go.call(box); else open(proto.src, '_blank', 'noopener');
    }
  });
  function syncFull(){
    var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fullLabel.textContent = T[document.documentElement.lang][on ? 'exit' : 'full'];
  }
  addEventListener('fullscreenchange', syncFull);
  addEventListener('webkitfullscreenchange', syncFull);

  /* hide-ui=1 takes Figma's own restart away with the rest of the chrome, so
     the room supplies one */
  document.getElementById('restart').addEventListener('click', function(){
    shown = false;
    proto.classList.remove('ready'); wait.classList.remove('gone');
    proto.src = proto.src;
  });
})();

/* The nav carries the site's language switch, so it has to actually switch.
   The room is a dozen words, so this is all of it — no persistence, which is
   what the site does too (it opens in English every time). */
var CREDIT = '<a href="https://elifbeyzauysal.com/">Elif Beyza Uysal</a>';
var T = {
  en:{ work:'Work', about:'About', contact:'Contact',
       sub:'Jotform, inside WordPress',
       hint:'This is the prototype itself, not a picture of it. <b>Click the sidebar, the tabs and the cards.</b> Overview, User Rates and Conversation Rates are all wired.',
       loading:'Loading the prototype', restart:'Start over', figma:'Open in Figma',
       more:'See more work', full:'Full screen', exit:'Exit full screen',
       foot:'A clickable prototype — the sidebar, the tabs and the cards all respond.<br>'+
            'Analytics for Jotform AI Chatbot · design by '+CREDIT+'.' },
  tr:{ work:'İşler', about:'Hakkında', contact:'İletişim',
       sub:'WordPress içinde Jotform',
       hint:'Bu, prototipin resmi değil, kendisi. <b>Kenar çubuğuna, sekmelere ve kartlara tıklayabilirsin.</b> Overview, User Rates ve Conversation Rates üçü de bağlı.',
       loading:'Prototip yükleniyor', restart:'Baştan başlat', figma:'Figma\u2019da aç',
       more:'Diğer işlere bak', full:'Tam ekran', exit:'Tam ekrandan çık',
       foot:'Tıklanabilir prototip — kenar çubuğu, sekmeler ve kartlar cevap veriyor.<br>'+
            'Jotform AI Chatbot analitiği · tasarım: '+CREDIT+'.' }
};
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(function(e){ e.textContent = T[l][e.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(function(e){ e.innerHTML = T[l][e.dataset.i18nHtml]; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===l); });
  if(document.fullscreenElement || document.webkitFullscreenElement){
    document.querySelector('#full span').textContent = T[l].exit;
  }
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ setLang(b.dataset.lang); });
});
setLang('en');
</script>
</body>
