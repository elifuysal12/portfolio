*{box-sizing:border-box}
:root{
  --ink:#0F1115; --ink-2:#08090C;
  --paper:#F3EFE7; --dim:#8B8F9C;
  --coral:#FF7643; --pink:#FF557D;
  --ramp:linear-gradient(96deg,#FF7643,#FF557D);
}
html,body{height:100%}
body{
  margin:0; background:var(--ink-2); color:var(--paper);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
  /* the case study's light source: warm, low, off to one side, so the monitor
     stands in front of something rather than on flat black */
  background-image:
    radial-gradient(110% 80% at 14% 106%, rgba(255,118,67,.20), rgba(8,9,12,0) 60%),
    radial-gradient(80% 70% at 88% -10%, rgba(255,85,125,.14), rgba(8,9,12,0) 58%);
  background-attachment:fixed;
}
a{color:inherit}

/* THE SITE'S OWN NAV, not a bar invented for this room — same shape, same
   type, same order, carried into the dark the way body.case-open carries it
   on a case study. The section links are absolute because this is a separate
   address. */
nav{
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  z-index:50; display:flex; align-items:center; gap:6px;
  padding:7px 8px 7px 18px; border-radius:16px;
  background:rgba(24,26,33,.72); backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 24px rgba(0,0,0,.42);
}
nav .mark{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:15px;
  letter-spacing:-.02em;margin-right:14px;color:#fff;text-decoration:none;
  transition:opacity .25s ease}
nav a.mark:hover{opacity:.6}
nav .mark i{color:var(--coral);font-style:normal}
nav a{font-size:11px;letter-spacing:.01em;color:#B4B7C2;text-decoration:none;
  padding:8px 12px;border-radius:10px;transition:background .25s ease,color .25s ease}
nav a:hover{background:rgba(255,255,255,.09);color:#fff}
.lang{display:flex;gap:2px;margin-left:8px;padding:3px;border-radius:11px;background:rgba(255,255,255,.08)}
.lang button{font-family:inherit;font-size:12.5px;border:0;cursor:pointer;padding:5px 9px;
  border-radius:8px;background:transparent;color:var(--dim);
  transition:.3s cubic-bezier(.34,1.4,.5,1)}
.lang button.on{background:#fff;color:var(--ink)}

/* ---- the desk ---- */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:84px 22px 14px}
.rig{display:flex;flex-direction:column;align-items:center}
/* dark aluminium, a hair lighter along the top edge where the light lands */
.mon{position:relative;padding:14px 14px 30px;border-radius:20px;
  background:linear-gradient(#33363F,#1C1E24 22%,#16181D);
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset, 0 0 0 1px #0A0B0E,
             0 40px 70px -28px rgba(0,0,0,.85), 0 8px 24px rgba(0,0,0,.5)}
.mon:after{content:'';position:absolute;left:50%;bottom:13px;width:5px;height:5px;
  margin-left:-2.5px;border-radius:50%;background:#5EE38A;
  box-shadow:0 0 8px rgba(94,227,138,.75)}
.screen{position:relative;border-radius:7px;overflow:hidden;background:#F0F0F1;
  box-shadow:0 0 0 1px rgba(0,0,0,.55) inset}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;
  opacity:0;transition:opacity .5s ease}
.screen iframe.ready{opacity:1}
/* the player takes a few seconds and shows white while it does; the room
   holds a dark card over it until the frame reports back */
.wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:#14161C;color:var(--dim);font-size:13px;
  transition:opacity .45s ease}
.wait.gone{opacity:0;pointer-events:none}
.wait .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.wait .bar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--ramp);
  animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(255%)}}
.neck{width:118px;height:52px;background:linear-gradient(90deg,#1A1C22,#2A2D35 42%,#15171C);
  clip-path:polygon(24% 0,76% 0,100% 100%,0 100%)}
.foot{width:280px;height:16px;border-radius:0 0 14px 14px;
  background:linear-gradient(#2A2D35,#15171C);box-shadow:0 22px 34px -18px rgba(0,0,0,.9)}

/* the room's own line, under the desk — the nav belongs to the site, this
   belongs to the prototype */
.cap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  margin:22px 0 0;font-size:13.5px;color:var(--dim)}
.cap b{color:var(--paper);font-weight:600;letter-spacing:-.01em}
.cap button,.cap a{display:inline-flex;align-items:center;gap:6px;font:inherit;
  color:#B4B7C2;text-decoration:none;cursor:pointer;background:none;border:0;
  border-bottom:1px solid rgba(243,239,231,.2);padding:0 0 1px;
  transition:color .2s ease,border-color .2s ease}
.cap button:hover,.cap a:hover{color:var(--coral);border-color:var(--coral)}
.foot-note{flex:0 0 auto;padding:10px clamp(14px,3vw,26px) 14px;font-size:12.5px;
  color:#6B6F7B;text-align:center}

@media (max-width:900px){
  body{overflow:auto}
  main{flex:0 0 auto;padding:74px 10px 6px;justify-content:flex-start}
  .mon{padding:7px 7px 7px;border-radius:12px}
  .mon:after,.neck,.foot{display:none}
  nav{top:10px;padding-left:14px} nav a{padding:8px 9px}
}

<nav>
  <a class="mark" href="https://elifbeyzauysal.com/" aria-label="Elif Uysal — home">elif<i>.</i></a>
  <a href="https://elifbeyzauysal.com/#work" data-i18n="work">Work</a>

</nav>

<main>
  <div class="rig">
    <div class="mon">
      <div class="screen" id="screen">
        <iframe id="proto" src="https://embed.figma.com/proto/2x6KiLkwK5G2oheLZrzSaS/Jotform?node-id=1384-158976&page-id=930%3A24958&starting-point-node-id=1384%3A146915&scaling=scale-down-width&content-scaling=fixed&hide-ui=1&embed-host=elifbeyzauysal" title="Chatbot Dashboard — prototype"
                allowfullscreen loading="eager"></iframe>
        <div class="wait" id="wait">
          <span data-i18n="loading">Loading the prototype</span>
          <span class="bar"><i></i></span>
        </div>
      </div>
    </div>

    <div class="foot"></div>
  </div>

  <p class="cap">
    <span><b>Chatbot Dashboard</b> &middot; <span data-i18n="sub">Jotform, inside WordPress</span></span>
    <button id="restart" data-i18n="restart">Start over</button>
    <a href="https://www.figma.com/proto/2x6KiLkwK5G2oheLZrzSaS/Jotform?node-id=1384-158976&page-id=930%3A24958&starting-point-node-id=1384%3A146915&scaling=scale-down-width&content-scaling=fixed" target="_blank" rel="noopener noreferrer" data-i18n="figma">Open in Figma</a>
  </p>
</main>

<p class="foot-note" data-i18n-html="foot"></p>

<script>
/* The screen is cut to the prototype's own 1440x900, so `scale-down-width`
   lands the frame exactly: no letterbox, no scroll inside the player. The box
   is sized in JS because it has to fit whatever is left after the nav, the
   stand and the caption — a CSS aspect-ratio alone would overflow tall. */
(function(){
  var W=1440, H=900,
      screen=document.getElementById('screen'),
      main=document.querySelector('main'),
      cap=document.querySelector('.cap');
  function fit(){
    var narrow = innerWidth<=900;
    // clientHeight includes the padding that keeps the nav off the bezel, so
    // it has to come back out or the monitor grows under the pill
    var cs = getComputedStyle(main);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var availW = main.clientWidth - padX - (narrow?14:28);
    // bezel 14 + chin 30 + neck 52 + foot 16 = 112, and a little slack under it
    var availH = main.clientHeight - padY - (narrow?0:122) - cap.offsetHeight - 14;
    var k = narrow ? availW/W : Math.min(availW/W, availH/H);
    k = Math.max(.16, Math.min(k, 1));
    screen.style.width  = Math.round(W*k)+'px';
    screen.style.height = Math.round(H*k)+'px';
  }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', fit);

  var proto=document.getElementById('proto'), wait=document.getElementById('wait');
  proto.addEventListener('load', function(){
    /* the frame fires load before the player has painted, so give it a beat
       rather than swapping a dark card for a white one */
    setTimeout(function(){ proto.classList.add('ready'); wait.classList.add('gone'); }, 900);
  });
  /* hide-ui=1 takes Figma's own restart away with the rest of the chrome, so
     the room supplies one */
  document.getElementById('restart').addEventListener('click', function(){
    proto.classList.remove('ready'); wait.classList.remove('gone');
    proto.src = proto.src;
  });
})();

/* The nav carries the site's language switch, so it has to actually switch.
   The room is a dozen words, so this is all of it — no persistence, which is
   what the site does too (it opens in English every time). */
var CREDIT = '<a href="https://elifbeyzauysal.com/">Elif Beyza Uysal</a>';
var T = {
  en:{ work:'Work', about:'About', contact:'Contact',
       sub:'Jotform, inside WordPress',
       loading:'Loading the prototype', restart:'Start over', figma:'Open in Figma',
       foot:'A clickable prototype — the sidebar, the tabs and the cards all respond.<br>'+
            'Analytics for Jotform AI Chatbot · design by '+CREDIT+'.' },
  tr:{ work:'İşler', about:'Hakkında', contact:'İletişim',
       sub:'WordPress içinde Jotform',
       loading:'Prototip yükleniyor', restart:'Baştan başlat', figma:'Figma\u2019da aç',
       foot:'Tıklanabilir prototip — kenar çubuğu, sekmeler ve kartlar cevap veriyor.<br>'+
            'Jotform AI Chatbot analitiği · tasarım: '+CREDIT+'.' }
};
function setLang(l){
  document.documentElement.lang = l;
  document.querySelectorAll('[data-i18n]').forEach(function(e){ e.textContent = T[l][e.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-html]').forEach(function(e){ e.innerHTML = T[l][e.dataset.i18nHtml]; });
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.lang===l); });
  dispatchEvent(new Event('resize'));
}
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ setLang(b.dataset.lang); });
});
setLang('en');
</script>
