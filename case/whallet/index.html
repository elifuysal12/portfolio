/* =============================================================
   ROUTES — the sheets are the pages people actually come for, so
   they get addresses: /case/cursor/, /cv/. Three things follow.
   The Back button closes a sheet instead of leaving the site, a
   case study can be linked to directly (build.py writes a real
   file at each address, so the link survives a cold load), and
   analytics can tell "opened the Cursor case" from "landed".
   Off in the Artifact build: that URL belongs to the host.
   ============================================================= */
const ROUTES = true;
let routing = false, routeQueued = false;

const routeNow = () => {
  const key  = caseOpen && caseKey;
  const path = key ? `/case/${key}/` : cvOpen ? '/cv/' : '/';
  const p    = key && PROJECTS.find(x=>x.key===key);
  document.title = p ? `${p.mark} — Elif Uysal`
                : cvOpen ? `CV — Elif Uysal`
                : 'Elif Uysal — Product Designer';
  if(location.pathname !== path) history.pushState({sheet:path},'',path);
};
/* opening a case closes the CV on its way in, so state settles a beat after
   the call that changed it — one microtask later there is a single answer */
function syncRoute(){
  if(!ROUTES || routing || routeQueued) return;
  routeQueued = true;
  queueMicrotask(()=>{ routeQueued = false; routeNow(); });
}

function applyRoute(path){
  routing = true;
  const m = path.match(/^\/case\/([a-z0-9-]+)\/?$/);
  if(m && CASES[m[1]]){ closeCV(); if(caseKey !== m[1]) openCase(m[1]); }
  else if(/^\/cv\/?$/.test(path)){ closeCase(); openCV(); }
  else { closeCase(); closeCV(); }
  routing = false;
}

/* Same tab. Every demo runs on this domain now, so opening one in a new window

/* one screen with its caption — `k` switches the caption to the tracked
   small-caps label the board uses under the solution screens. A shot may

const shotHTML = (s,k,cls) =>
  `<figure class="cs-shot rv${cls?' '+cls:''}">`+
  (s.svg || `<img src="${s.img}" alt="" loading="lazy" decoding="async">`)+
  `<figcaption class="cs-cap${k?' k':''}"><b>${s.t}</b><p>${s.p}</p></figcaption></figure>`;

   phones carry whichever one they were drawn on — so `alt` is not decoration,
   it is what keeps the screens from sitting in a visible rectangle. */

function sectionHTML(s,d,u){

    case 'band':

/* THE COVER HANDS THE POINTER OVER.
   The page argues that the assistant should be the cursor, so inside the
   catalogue it is: the native arrow is hidden and the gradient one takes the
   pointer's exact position, the sentence trailing at its tip. Leave the tiles —
   or scroll the cover away — and the pair springs back to the parked pose the
   board was drawn in, and the machine's own cursor comes back.
   Mouse only: there is no pointer to borrow on a touch screen. */
function wireCover(){
  const art = caseSheet.querySelector('.cover-art');
  const rig = art && art.querySelector('.cover-rig');
  if(!rig) return;

  const park = () => {                        // the pose in Elif's board
    const r = art.getBoundingClientRect();
    return [r.width * .24, r.height * .34];
  };
  const put = (x,y) => rig.style.transform = `translate3d(${x}px,${y}px,0)`;
  const goPark = spring => {
    rig.style.transition = spring ? 'transform .72s cubic-bezier(.22,1.1,.32,1)' : 'none';
    rig.classList.remove('flip');
    const [x,y] = park(); put(x,y);
  };
  goPark(false);

  if(!matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  let live = false, cx = 0, cy = 0;            // last pointer, in client space
  const follow = () => {
    const r = art.getBoundingClientRect();
    const x = cx - r.left, y = cy - r.top;
    /* the pill needs room on the right; against the window — not the tile
       block — it swaps sides, so it only flips when it would truly be cut off
       rather than every time it crosses the last column */
    const slot = rig.querySelector('.say-slot');
    rig.classList.toggle('flip', cx + slot.offsetWidth + 70 > innerWidth);
    put(x,y);
  };
  const stop = () => { if(!live) return; live = false; art.classList.remove('live'); goPark(true); };

  art.addEventListener('pointerenter', e => {
    if(e.pointerType !== 'mouse') return;
    live = true; art.classList.add('live'); rig.style.transition = 'none';
    cx = e.clientX; cy = e.clientY; follow();
  });
  art.addEventListener('pointermove', e => {
    if(!live) return;
    cx = e.clientX; cy = e.clientY; follow();
  });
  art.addEventListener('pointerleave', stop);
  /* scrolling moves the cover out from under a still pointer, so no pointermove
     fires and the arrow would drift off it */
  caseEl.addEventListener('scroll', () => {
    if(!live) return;
    const r = art.getBoundingClientRect();
    (cx < r.left || cx > r.right || cy < r.top || cy > r.bottom) ? stop() : follow();
  }, {passive:true});
  addEventListener('resize', () => { live ? follow() : goPark(false); });
}

/* ALTI's cover is the board's cover: her photograph of the façade, the navy
   poured over it, the viewfinder where the product's own gesture happens, and
   the type at the foot. The scrim and the type are CSS rather than baked into
   the export, so the cover reflows instead of shrinking to a postcard. */
const SCAN = '<svg class="alti-scan" viewBox="0 0 320 320" fill="none" aria-hidden="true">'+
  '<g stroke="rgba(255,255,255,.8)" stroke-width="4" stroke-linecap="round">'+
  '<path d="M8 62V12h50M262 12h50v50M312 258v50h-50M58 308H8v-50"/></g>'+
  '<circle cx="160" cy="160" r="98" stroke="rgba(255,255,255,.28)" stroke-width="2"/>'+
  '<path d="M160 96c-22.6 0-41 18.4-41 41.1C119 165.4 160 204 160 204s41-38.6 41-66.9c0-22.7-18.4-41.1-41-41.1Z"'+
  ' fill="url(#sg)"/><circle cx="160" cy="136" r="14" fill="#fff"/>'+
  '<defs><linearGradient id="sg" x1="119" y1="150" x2="201" y2="150" gradientUnits="userSpaceOnUse">'+
  '<stop stop-color="#FF557B"/><stop offset="1" stop-color="#FF751D"/></linearGradient></defs></svg>';

const altiCover = (key,d,p,u) =>
  `<section class="cs cover alti-cover">`+
    `<img class="cover-bg" src="${B.cover}" alt="" fetchpriority="high">`+
    `<div class="cover-top">`+
      `<p class="cover-kicker">${d.kicker}</p>`+
      `<span class="sig"><span class="eu">EU</span><span>Elif Beyza Uysal</span></span>`+
    `</div>`+
    `<div class="alti-copy">${SCAN}`+
      `<p class="alti-eyebrow">${d.eyebrow}</p>`+
      `<h1 class="alti-word">${d.word}</h1>`+
      `<p class="alti-sub">${d.sub}</p>`+
      `<p class="alti-line">${d.line}</p>`+
    `</div>`+
    `<div class="cover-foot">`+
      (CASES[key].demo?demoBtn(CASES[key].demo,u.demo):'')+
      `<div class="cs-meta">`+
        `<span>${u.role} <b>${d.role}</b></span>`+
        `<span>${u.year} <b>${p.year}</b></span>`+
        `<span>${u.kind} <b>${d.kind}</b></span>`+
      `</div>`+
    `</div>`+
  `</section>`;

function buildCase(key){
  const p = PROJECTS.find(x=>x.key===key); if(!p) return;
  const u = CASE_UI[L], d = CASES[key][L];

  /* the sheet carries the case's own art direction; `light` also tells the
     nav and the close pill to stay on paper instead of following it dark */
  caseEl.dataset.theme = CASES[key].theme || '';
  document.body.classList.toggle('case-light', !!CASES[key].light);

  if(CASES[key].cover === 'alti'){
    caseSheet.innerHTML = altiCover(key,d,p,u) + d.sections.map(s=>sectionHTML(s,d,u)).join('');
    caseSheet.querySelector('.case-back').onclick=()=>closeCase();
    revealCase();
    return;
  }

  caseSheet.innerHTML =
    `<section class="cs cover cs-mesh">`+
      `<div class="cover-top">`+
        `<p class="cover-kicker">${d.kicker}</p>`+
        `<span class="sig"><img src="${A.me}" alt=""><span>Elif Beyza Uysal</span></span>`+
      `</div>`+
      /* two kinds of cover. The Cursor page argues that the assistant should be
         the pointer, so its cover hands the pointer over. A project that makes
         no such claim gets the honest thing instead: the artwork itself. */
      (CASES[key].coverShot
        ? `<img class="cover-shot" src="${CASES[key].coverShot}" alt="${d.say.replace(/<[^>]+>/g,'')}">`
        : `<div class="cover-art">`+
            `<div class="tiles"><i></i><i></i><i></i><i></i></div>`+
            `<div class="cover-rig">`+
              `<div class="cover-cursor">${ARROW}</div>`+
              `<div class="say-slot"><div class="cover-say">${d.say}<kbd>Enter</kbd></div></div>`+
            `</div>`+
          `</div>`)+
      `<div class="cover-foot">`+
        (CASES[key].demo?demoBtn(CASES[key].demo,u.demo):'')+
        `<div class="cs-meta">`+
          `<span>${u.role} <b>${d.role}</b></span>`+
          `<span>${u.year} <b>${p.year}</b></span>`+
          `<span>${u.kind} <b>${d.kind}</b></span>`+
        `</div>`+
      `</div>`+
    `</section>`+
    d.sections.map(s=>sectionHTML(s,d,u)).join('');

  caseSheet.querySelector('.case-back').onclick=()=>closeCase();
  wireCover();
  revealCase();
}

/* the sheet scrolls inside itself, so its own reveal observer replaces the
   page-level one, which only ever saw the markup present at boot */
function revealCase(){
  const o=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); o.unobserve(e.target); }
  }),{rootMargin:'0px 0px -12% 0px',threshold:.06});
  caseSheet.querySelectorAll('.rv').forEach(el=>o.observe(el));
}

function openCase(key){
  if(!CASES[key]){ sayLine('soon'); return; }   // that page is not written yet
  closeCV();
  caseKey=key; buildCase(key);
  caseOpen=true; caseEl.scrollTop=0;
  document.body.classList.add('case-open','sheet-open');
  caseEl.setAttribute('aria-hidden','false');
  /* she stays on the home page — the case study speaks in its own voice,
     and #stage is hidden for the duration (see body.case-open) */
  renderChips([]);
  requestAnimationFrame(()=>caseEl.classList.add('open'));
  syncRoute();
}
function closeCase(){
  if(!caseOpen) return;
  caseOpen=false; caseKey=null;
  caseEl.classList.remove('open');
  document.body.classList.remove('case-open','sheet-open','case-light');
  caseEl.setAttribute('aria-hidden','true');
  resumeLine();
  syncRoute();
}

/* =============================================================
   LANGUAGE
   ============================================================= */
function applyLang(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(t()[k]!==undefined) el.innerHTML=t()[k];
  });
  buildStrip(); buildBand(); buildIndex(); splitStatement();
  if(caseOpen){ buildCase(caseKey); return; }
  if(cvOpen){ buildCV(); cvLines(); return; }   // the sheet is open — swap it in place
  zone=''; // force the current line to re-say itself in the new language
  const y=scrollY;
  if(y<innerHeight*.6){ sayLine('hero1'); setTimeout(()=>{ if(scrollY<innerHeight*.6) sayLine('hero2'); },3600);
    renderChips([
      {label:t().chips.work, on:()=>document.getElementById('work').scrollIntoView({behavior:'smooth'})},
      {label:t().chips.who,  on:()=>document.getElementById('about').scrollIntoView({behavior:'smooth'})},
    ]);
  }
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.lang button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); L=b.dataset.lang; applyLang();
});

/* nav + placeholder footer links: scroll in place instead of writing a hash
   into the host URL (this page is a single self-contained artifact) */
document.querySelectorAll('nav a[href^="#"], .foot a[href="#"]').forEach(a=>{
  if(a.id==='navAbout') return;                 // that one opens the CV instead
  a.addEventListener('click',e=>{
    e.preventDefault();
    closeCV(); closeCase();                     // leaving a sheet for a section
    const id=a.getAttribute('href').slice(1);
    const el=id && document.getElementById(id);
    if(el) el.scrollIntoView({behavior:RM?'auto':'smooth'});
  });
});

/* =============================================================
   BOOT
   ============================================================= */
document.documentElement.lang=L;
buildStrip(); buildBand(); buildIndex(); splitStatement();
requestAnimationFrame(tick);
setTimeout(()=>{
  sayLine('hero1');
  renderChips([
    {label:t().chips.work, on:()=>document.getElementById('work').scrollIntoView({behavior:'smooth'})},
    {label:t().chips.who,  on:()=>document.getElementById('about').scrollIntoView({behavior:'smooth'})},
  ]);
}, 700);
setTimeout(()=>{ if(scrollY<innerHeight*.6) sayLine('hero2'); }, 4600);
addEventListener('resize',()=>{ stripX=0; cardW=0; });

/* routes come last: applyRoute reaches for CASES and the sheets, which are
   declared above this line but only initialised once the script has run */
/* in the Artifact the root belongs to the host, so the wordmark keeps its
   click behaviour but stops pointing anywhere a cmd-click could follow */
if(!ROUTES) navHome.setAttribute('href','#');

if(ROUTES){
  addEventListener('popstate',()=>{ applyRoute(location.pathname); routeNow(); });
  /* landed straight on a sheet's address — build.py stamps which one on <body>,
     so the page opens there with no redirect and no flash of the home page */
  const entry = document.body.dataset.open;
  if(entry) applyRoute(entry === 'cv' ? '/cv/' : `/case/${entry.slice(5)}/`);
  routeNow();
}
</script>
