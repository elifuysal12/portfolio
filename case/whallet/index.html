/* ============================================================
   PALETTE — derived from the character herself:
   bandana red, navy tank, warm skin, cream paper.
   ============================================================ */
:root{
  color-scheme:light;          /* committed single-theme page — don't let the host tint it */

  /* Two colours and a ground: bandana red, ink black, cream paper. The navy
     from her tank is kept below for reference but nothing paints with it. */
  --paper:#F3EFE7;
  --paper-2:#F8F6F1;
  --tile:#F7F5F0;
  --ink:#17140F;
  --ink-2:#4A443A;
  --muted:#9A9285;
  --line:rgba(23,20,15,.11);
  --line-soft:rgba(23,20,15,.06);
  --accent:#D6342A;      /* bandana */
  --navy:#1F2E52;        /* tank top — reference only, unused */
  --skin:#F2C9A0;

  /* the hover payoff: the accent pouring across a word and dissolving back
     into the ink. Interpolated in oklab so the middle stays a deep oxblood
     rather than the flat brown sRGB gives you between red and near-black. */
  --grad:linear-gradient(102deg, #D6342A, #7A211A 58%, #17140F);
  --grad:linear-gradient(102deg in oklab, #D6342A, #17140F);

  /* Two families, not three. Bricolage carries the poster type; Fraunces
     carries everything else — labels included. The tracked-uppercase-mono
     label is the single loudest tell of a generated portfolio, so it is
     gone: labels are sentence case, at their natural width. */
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --label:'Instrument Sans',system-ui,sans-serif;
  --ui:'Instrument Sans',system-ui,sans-serif;
  --mono:var(--label);           /* legacy alias — nothing new should use it */

  --dock-h:150px;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--paper)}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ui); -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#fff}

/* keyboard users get to see where they are */
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* one place the gradient is defined for type, so every hover reads as the
   same gesture rather than four separate effects */
.grad-text{
  background-image:var(--grad);
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}

/* static grain — painted once, costs nothing per frame */
.grain{
  position:fixed; inset:0; pointer-events:none; z-index:60; opacity:.30; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.42'/></svg>");
}
/* warm glow behind the character — static gradient, no blur filter */
.glow{
  position:fixed; left:50%; top:52%; width:min(120vh,1100px); aspect-ratio:1;
  transform:translate(-50%,-50%); z-index:0; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, rgba(214,52,42,.10), rgba(214,52,42,.04) 38%, rgba(243,239,231,0) 66%);
  transition:opacity .8s ease;
}

/* ---------------- NAV ---------------- */
nav{
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  z-index:50; display:flex; align-items:center; gap:6px;
  padding:7px 8px 7px 18px; border-radius:16px;
  background:rgba(248,246,241,.72); backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--line); box-shadow:0 6px 24px rgba(23,20,15,.06);
}
/* the wordmark is the way home from every page — it has to shed everything
   `nav a` puts on the section links (mono type, pill padding, hover fill) */
nav .mark{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.02em;margin-right:14px;
  color:var(--ink);text-decoration:none;padding:0;border-radius:0;background:none;
  transition:opacity .25s ease}
nav a.mark:hover{background:none;color:var(--ink);opacity:.6}
nav .mark i{color:var(--accent);font-style:normal}
nav a{
  font-family:var(--mono); font-size:11px; letter-spacing:.01em;
  color:var(--ink-2); text-decoration:none; padding:8px 12px; border-radius:10px;
  transition:background .25s ease,color .25s ease;
}
nav a:hover{background:rgba(23,20,15,.06); color:var(--ink)}
.lang{display:flex;gap:2px;margin-left:8px;padding:3px;border-radius:11px;background:rgba(23,20,15,.05)}
.lang button{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.01em;border:0;cursor:pointer;
  padding:5px 9px;border-radius:8px;background:transparent;color:var(--muted);transition:.3s cubic-bezier(.34,1.4,.5,1);
}
.lang button.on{background:var(--ink);color:var(--paper)}

/* ---------------- CHARACTER STAGE (fixed, scroll-driven) ---------------- */
#stage{position:fixed;inset:0;z-index:40;pointer-events:none}
#char{
  position:absolute; left:0; top:0; width:720px; height:713px;
  transform-origin:50% 100%; will-change:transform;
}
#charFigure{
  position:relative; left:3.5px; width:713px; height:713px;
  will-change:transform; transform-origin:50% 75%;
  filter:drop-shadow(0 18px 30px rgba(23,20,15,.18));
}
#char img{
  width:100%; height:100%; display:block; object-fit:contain; object-position:center bottom;
  user-select:none;
}
/* A local lip mesh keeps the original face and hair stable. Its canvas
   maps source pixels 510,450–754,622 into the square portrait. */
#charMouth{
  position:absolute; left:40.669856%; top:35.885167%;
  width:19.457735%; height:13.716108%; opacity:0;
  pointer-events:none;
}
#char img[hidden]{display:none}

/* dialogue — sits beside her, never labelled as an "assistant" */
#say{
  position:absolute; left:0; top:0; width:min(360px,74vw);
  will-change:transform,opacity; opacity:0;
  transition:opacity .5s ease;
}
#say.show{opacity:1}
.say-card{
  position:relative; display:flex; gap:12px; align-items:flex-start;
  width:fit-content; max-width:100%;
  padding:14px 16px 14px 14px; border-radius:16px;
  background:rgba(248,246,241,.86); backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line); box-shadow:0 10px 34px rgba(23,20,15,.08);
}
.say-card:before{ /* tail pointing back at her */
  content:''; position:absolute; left:-5px; top:26px; width:11px; height:11px;
  background:rgba(248,246,241,.9); border-left:1px solid var(--line); border-bottom:1px solid var(--line);
  transform:rotate(45deg); border-radius:0 0 0 3px;
}
/* docked bottom-right: she is on the right, so the tail points that way */
#say.flip .say-card{margin-left:auto}
#say.flip .say-card:before{
  left:auto; right:-5px;
  border-left:0; border-bottom:0;
  border-right:1px solid var(--line); border-top:1px solid var(--line);
  border-radius:0 3px 0 0;
}
#say.flip .chips{justify-content:flex-end;padding-left:0;padding-right:2px}
.say-ico{
  flex:0 0 auto; width:30px;height:30px;border-radius:9px;
  background:rgba(214,52,42,.09); display:grid;place-items:center; overflow:hidden; position:relative;
}
.say-ico svg{width:17px;height:17px;stroke:var(--accent);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;position:absolute;
  transition:transform .5s cubic-bezier(.22,1.3,.36,1), opacity .32s ease;}
.say-ico svg.out{transform:translateY(-130%);opacity:0}
.say-ico svg.in-pre{transform:translateY(130%);opacity:0}
.say-txt{font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);padding-top:3px;min-height:19px;max-width:32ch}
.caret{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chips{display:flex;gap:7px;margin-top:9px;padding-left:2px;flex-wrap:wrap}
.chip{
  pointer-events:auto; cursor:pointer; border:1px solid var(--line); background:rgba(248,246,241,.9);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;color:var(--ink-2);
  padding:7px 11px;border-radius:11px; backdrop-filter:blur(8px);
  transition:transform .4s cubic-bezier(.34,1.5,.5,1),background .25s,color .25s,border-color .25s;
}
.chip:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:translateY(-2px)}

/* ---------------- LAYOUT ---------------- */
main{position:relative;z-index:10}
section{position:relative}
.pad{padding-inline:clamp(20px,5vw,72px)}
.eyebrow{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.01em;color:var(--muted);
  display:flex;align-items:center;gap:9px;
}
.eyebrow:before{content:'';width:22px;height:1px;background:var(--muted);opacity:.6}

/* HERO */
#hero{height:100svh;min-height:620px;display:flex;flex-direction:column;justify-content:center;position:relative}
.hero-type{position:relative;z-index:1;pointer-events:none;text-align:center;line-height:.78}
.hero-type span{
  display:block; font-family:var(--display); font-weight:800; letter-spacing:-.045em;
  font-size:clamp(64px,16.5vw,250px); color:var(--ink);
}
.hero-type span.b{color:transparent;-webkit-text-stroke:1.4px rgba(23,20,15,.42)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;
  animation:pulse 2.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

/* WORK STRIP — the Relate mechanic, rebuilt */
#work{padding-top:6vh;padding-bottom:8vh}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:26px}
.strip-head h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,58px);letter-spacing:-.035em;line-height:.95}
.strip-head p{font-family:var(--mono);font-size:11px;color:var(--muted);max-width:280px;line-height:1.6;text-align:right}

/* discipline badge: icon only at rest, unfurls its label on hover */

/* thin counter-drifting capability band */

/* ABOUT */
#about{padding-block:clamp(90px,15vh,190px)}
.statement{
  font-family:var(--display);font-weight:400;font-size:clamp(26px,4.6vw,62px);
  line-height:1.08;letter-spacing:-.032em;max-width:17ch;margin-top:26px;
}
.statement w{display:inline-block;opacity:0;transform:translateY(16px) rotate(2deg);
  transition:opacity .5s ease,transform .7s cubic-bezier(.2,1.1,.3,1)}
.statement.in w{opacity:1;transform:none}
.statement em{font-style:normal;color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:clamp(28px,6vw,80px);margin-top:clamp(44px,7vh,80px);padding-top:26px;border-top:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,4.4vw,54px);letter-spacing:-.04em;line-height:1}
.stat s{display:block;text-decoration:none;font-family:var(--mono);font-size:12.5px;letter-spacing:.01em;color:var(--muted);margin-top:8px}

/* EXPERIENCE — the CV, told as a list rather than a wall */
#experience{padding-block:clamp(70px,11vh,140px);border-top:1px solid var(--line)}
.exp-h{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,58px);
  letter-spacing:-.035em;line-height:.95;margin-top:22px}
.exp{list-style:none;margin-top:clamp(34px,5vh,56px)}
.exp-row{
  display:grid;grid-template-columns:minmax(150px,.9fr) minmax(0,2.1fr);
  gap:clamp(14px,3vw,54px);padding:clamp(22px,3vh,34px) 0;
  border-top:1px solid var(--line-soft);
}
.exp-row:first-child{border-top:0}
.exp-when{font-family:var(--mono);font-size:13px;letter-spacing:.01em;color:var(--muted);
  padding-top:6px}
.exp-when b{display:block;color:var(--ink);font-size:12px;letter-spacing:.01em;margin-bottom:5px}
.exp-role{font-family:var(--display);font-weight:800;font-size:clamp(19px,2.1vw,27px);
  letter-spacing:-.025em;line-height:1.15}
.exp-role i{font-style:normal;color:var(--accent)}
/* list-style:none is load-bearing — an <li> keeps display:list-item inside a
   flex container, so without this the browser's own bullet renders alongside
   the accent dot below and every line gets two markers */
.exp-what{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:7px}
.exp-what li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:62ch}
.exp-what li:before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--accent);opacity:.5}
@media (max-width:820px){ .exp-row{grid-template-columns:1fr;gap:10px} .exp-when{padding-top:0} }

/* CONTACT */
#contact{padding-block:clamp(90px,16vh,200px);border-top:1px solid var(--line);position:relative;overflow:hidden}
.big-cta{
  display:block;text-decoration:none;color:var(--ink);
  font-family:var(--display);font-weight:800;letter-spacing:-.05em;line-height:.85;
  font-size:clamp(52px,13vw,190px);margin-top:22px;
  background-image:var(--grad);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:var(--ink);
  transition:-webkit-text-fill-color .45s ease;
}
.big-cta:hover{-webkit-text-fill-color:transparent}
/* Three columns, and the third is left empty on purpose: she docks into the
   bottom-right corner and was sitting on top of the profile links. The links
   take the middle, clear of her; the copyright keeps the left. */
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  margin-top:clamp(50px,8vh,90px);
  font-family:var(--mono);font-size:12.5px;letter-spacing:.01em;color:var(--muted)}
.foot>:nth-child(2){justify-self:center}
@media (max-width:640px){ .foot{grid-template-columns:1fr;justify-items:center;text-align:center} }
/* no rule under them at rest — three underlined words in a row read as a form
   field, not a signature. The colour does the work on hover. */
.foot a{color:var(--ink-2);text-decoration:none;padding-bottom:2px;transition:color .2s ease}
.foot a:hover{color:var(--accent)}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.05,.3,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:820px){
  :root{--dock-h:104px}
  /* Leave room for the dialogue above the portrait on narrow screens. */
  #hero .hero-type{transform:translateY(-15svh)}
  nav .mark{margin-right:6px}
  nav a{padding:7px 8px;font-size:10px}
  .strip-head{flex-direction:column;gap:10px}
  .strip-head p{text-align:left;max-width:none}
  #say{width:calc(100vw - 32px)}
  }
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}

/* a centred measure — the about block was hugging the left edge with a
   dead half-page beside it */
.col{max-width:1120px;margin-inline:auto}
#about{padding-block:clamp(56px,9vh,120px)}
#about .statement{max-width:20ch}

/* ============================================================
   ABOUT PAGE — the CV lives here, not on the home page
   ============================================================ */
.about-page{padding-top:clamp(120px,16vh,180px)}
.about-hero{padding-bottom:clamp(50px,8vh,90px)}
.about-title{
  font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.92;
  font-size:clamp(48px,8vw,110px);margin-top:18px;
}
.about-role{margin-top:14px;font-size:15px;color:var(--ink-2)}
.about-bio{
  margin-top:clamp(24px,4vh,40px);max-width:58ch;
  font-size:clamp(17px,1.5vw,20px);line-height:1.65;color:var(--ink-2);
}
.about-links{display:flex;flex-wrap:wrap;gap:22px;margin-top:clamp(24px,4vh,38px)}
.about-links a{
  color:var(--ink);text-decoration:none;font-size:15px;
  border-bottom:1px solid var(--line);padding-bottom:3px;transition:color .25s,border-color .25s;
}
.about-links a:hover{color:var(--accent);border-color:var(--accent)}

.about-block{padding-block:clamp(46px,7vh,84px);border-top:1px solid var(--line)}
.block-h{
  font-family:var(--display);font-weight:800;font-size:clamp(24px,3.4vw,42px);
  letter-spacing:-.035em;line-height:1;margin-bottom:clamp(26px,4vh,42px);
}
.skills{list-style:none;display:flex;flex-wrap:wrap;gap:9px}
.skills li{
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  font-size:14px;color:var(--ink-2);background:var(--paper-2);
}
.about-end{text-align:center}
.about-end .big-cta{margin-top:0}
.about-back{margin-top:clamp(34px,5vh,60px)}
.about-back a{color:var(--muted);text-decoration:none;font-size:15px}
.about-back a:hover{color:var(--accent)}
nav a[aria-current="page"]{background:rgba(23,20,15,.07);color:var(--ink)}

/* ============================================================
   Hero → About should read as two frames, not one screen and
   then a long silence. Each becomes a full viewport that the
   scroll clicks into.
   ============================================================ */
html{scroll-snap-type:y proximity}
#hero,#about,#work,#contact{scroll-snap-align:start}

#about{
  min-height:100svh;
  display:flex; flex-direction:column; justify-content:center;
  padding-block:clamp(40px,6vh,80px);
  text-align:center;                 /* centred page, centred type */
}
#about .eyebrow{justify-content:center}
#about .statement{
  max-width:22ch; margin-inline:auto; margin-top:clamp(20px,3vh,34px);
}
#about .stats{justify-content:center}
#about .stat{text-align:center}

/* ============================================================
   WORK INDEX — photo first
   Relate's structure (big stills, quiet caption underneath), in
   paper rather than black. The image is the card; the words sit
   under it and stay out of the way.
   ============================================================ */
#work{padding-top:clamp(40px,7vh,90px);padding-bottom:clamp(60px,9vh,120px)}
.index{
  list-style:none; margin-top:clamp(26px,4vh,46px);
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(22px,3vw,48px) clamp(18px,2.4vw,36px);
}
.index li:first-child{grid-column:1 / -1}          /* the featured one */

.entry{display:flex;flex-direction:column;gap:13px;text-decoration:none;color:inherit}
.entry-media{
  display:grid; place-items:center; overflow:hidden;
  aspect-ratio:16/10; border-radius:18px;
  background:linear-gradient(160deg,#FBFAF7,#EFEBE3);
  border:1px solid var(--line);
  transition:transform .55s cubic-bezier(.22,1.1,.36,1), box-shadow .55s ease;
}
/* 24:9 unless the featured cover brings its own shape — see coverRatio: a
   banner drawn at 21:9 would lose the tops of its phones to a 24:9 frame, and
   the card is the thing that can bend */
.index li:first-child .entry-media{aspect-ratio:var(--cover-ar,24/9)}
.entry:hover .entry-media{transform:translateY(-6px);box-shadow:0 26px 50px -28px rgba(23,20,15,.35)}
.entry-media img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.86);transition:filter .45s ease}
/* A cover drawn to its own edges — a poster rather than a photograph — gets
   shown whole instead of cropped, and the card takes the artwork's own ground
   so the leftover reads as more of the picture rather than as a letterbox. */
.entry-media.own{border-color:transparent}
.entry-media.own img{object-fit:contain;filter:none}
.entry:hover .entry-media img{filter:saturate(1)}
/* until an export exists, the slot holds the name — deliberate, not empty */
.plate{
  font-family:var(--display); color:var(--ink); opacity:.4;
  text-align:center; padding-inline:18px; line-height:1;
  transform:scale(1.7); transition:opacity .4s ease;
}
.entry:hover .plate{opacity:.66}

.entry-body{display:flex;flex-direction:column;gap:7px}

/* who it was for comes first — the client carries as much weight here as the
   project name, and it is readable without hovering anything */
.entry-brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.entry-brand .brand{font-size:14px;color:var(--ink);opacity:1;overflow:visible}
.entry-brand .brand img{height:19px;max-width:132px}
.entry-year{font-style:normal;font-size:12.5px;color:var(--muted)}
.entry-note{
  font-size:11.5px;color:var(--accent);background:rgba(214,52,42,.09);
  padding:4px 9px;border-radius:8px;
}
.entry-title{font-family:var(--display);font-weight:800;letter-spacing:-.03em;line-height:1.05;
  font-size:clamp(19px,1.9vw,26px);
  align-self:flex-start;   /* hug the word, so the gradient ramps across it and
                              not across a mostly-empty full-width box */
  background-image:var(--grad);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:var(--ink);
  transition:-webkit-text-fill-color .4s ease}
.entry:hover .entry-title{-webkit-text-fill-color:transparent}
.entry-line{font-size:15px;line-height:1.55;color:var(--ink-2);max-width:52ch}
.entry-with{display:block;margin-top:7px;font-size:13.5px;color:#8A8B92;letter-spacing:.005em}

.entry-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.entry-tags i{
  font-style:normal;display:inline-flex;align-items:center;gap:6px;
  padding:5px 10px;border-radius:9px;background:rgba(23,20,15,.045);
  font-size:12px;color:var(--ink-2);
  transition:background .32s ease,color .32s ease;
}
.entry-tags svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.entry:hover .entry-tags i{background:rgba(214,52,42,.08);color:var(--accent)}
.entry-go{display:none}

@media (max-width:820px){ .index{grid-template-columns:1fr} .index li:first-child .entry-media{aspect-ratio:var(--cover-ar,16/10)} }

/* the hero title answers the cursor. The gradient sits under the type the
   whole time and the fill colour is what animates — background-image can't
   transition, text-fill-color can, so the wash arrives instead of snapping. */
.hero-type{pointer-events:auto}
.hero-type span{
  background-image:var(--grad);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:var(--ink);
  transition:-webkit-text-fill-color .45s ease,-webkit-text-stroke-color .45s ease;
}
/* the outline word is transparent by definition, so it must not carry the
   gradient underneath — background-clip:text would just show it through */
.hero-type span.b{background-image:none;-webkit-text-fill-color:transparent}
.hero-type:hover span{-webkit-text-fill-color:transparent}
/* PRODUCT takes the red-into-ink wash; DESIGNER's outline answers in flat red,
   so the two words carry the whole palette between them */
.hero-type:hover span.b{-webkit-text-stroke-color:var(--accent)}

/* ============================================================
   WORK STRIP — the drifting marks. These rules were lost when the
   index was added; without them .track is not a flex row, the
   tiles have no size, and the badge SVGs fall back to a solid
   black fill at full width.
   ============================================================ */
.strip{position:relative;overflow:hidden;border-block:1px solid var(--line);background:var(--tile)}
.strip:before,.strip:after{content:'';position:absolute;top:0;bottom:0;
  width:clamp(40px,9vw,150px);z-index:3;pointer-events:none}
.strip:before{left:0;background:linear-gradient(90deg,var(--paper),rgba(243,239,231,0))}
.strip:after{right:0;background:linear-gradient(270deg,var(--paper),rgba(243,239,231,0))}
.track{display:flex;will-change:transform}
.tile{
  flex:0 0 auto;width:clamp(190px,19vw,268px);aspect-ratio:1;
  border-right:1px solid var(--line-soft);position:relative;
  display:grid;grid-template-rows:auto 1fr auto;gap:8px;
  padding:14px 14px 13px;text-decoration:none;
  pointer-events:auto;cursor:pointer;background:var(--tile);
  transition:background .28s ease;
}
.tile:hover{background:#fff}

/* the client is the headline of a portfolio tile, so it is legible at rest —
   the disciplines are what the hover pays out */
.tile-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{
  font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:-.01em;
  color:var(--ink-2);opacity:.62;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:opacity .3s ease,color .3s ease;
}
.brand img{height:15px;width:auto;max-width:104px;display:block;object-fit:contain}
.tile:hover .brand{opacity:1;color:var(--ink)}
.tile .yr{font-size:11.5px;color:var(--muted);opacity:.5;flex:0 0 auto;transition:opacity .3s}
.tile:hover .yr{opacity:1}

.wordmark{
  align-self:center;justify-self:center;
  font-family:var(--display);font-weight:600;color:var(--ink);opacity:.28;
  text-align:center;padding-inline:4px;line-height:1;
  transition:opacity .34s ease,transform .5s cubic-bezier(.22,1.2,.36,1);
}
.tile:hover .wordmark{opacity:1;transform:translateY(-4px)}

.tile-foot{display:grid;gap:5px;justify-items:center;min-height:34px;align-content:end}
.discs{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 7px;
  font-size:11px;color:var(--ink-2);text-align:center;
  opacity:0;transform:translateY(7px);
  transition:opacity .34s ease,transform .5s cubic-bezier(.22,1.2,.36,1);
}
.discs i{font-style:normal;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.discs svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.tile:hover .discs{opacity:1;transform:none}
.tile .cta{
  font-size:12px;color:var(--accent);opacity:0;transform:translateY(7px);
  transition:opacity .3s ease,transform .5s cubic-bezier(.22,1.3,.36,1);
}
.tile:hover .cta{opacity:1;transform:translateY(0)}

/* logo slots — a real mark drops straight in and the typographic stand-in
   steps aside. Nothing else has to change. */
.wordmark img{max-width:78%;max-height:56px;width:auto;height:auto;object-fit:contain;margin-inline:auto;display:block}
.plate-img{
  max-width:46%;max-height:54%;width:auto;height:auto;object-fit:contain;
  opacity:.82;transition:opacity .4s ease;
}
.entry:hover .plate-img{opacity:1}

/* the discipline marquee runs on black — one dark rule across the cream, so the
   list reads as a strip of its own rather than as more page */
.band{overflow:hidden;padding:15px 0;background:var(--ink)}
.band .track{gap:0}
.band i{
  font-style:normal;font-size:13px;color:rgba(243,239,231,.66);
  padding-inline:26px;white-space:nowrap;display:inline-flex;align-items:center;gap:26px;
}
.band i:after{content:'';width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.9}

/* ============================================================
   FEATURED ENTRY — same stacked card as the others, only scaled
   to its 24/9 frame: a wider measure and a slightly larger line,
   so a longer sentence sits under the big picture without the
   card turning into a different layout.
   ============================================================ */
.index li:first-child .entry-line{max-width:70ch;font-size:16.5px;line-height:1.62}

/* The red→ink wash needs room to read as one gesture. On the big
   hero words and the CTA it does; on a 26px project title it just
   looks like the word is dirty halfway through. So the small titles
   answer in flat bandana red instead. */
.entry:hover .entry-title{-webkit-text-fill-color:var(--accent)}

/* ============================================================
   CV — the About link opens the résumé over the page. Same
   paper, same two families, same eyebrow-and-rule rhythm: it
   reads as another page of the site rather than a PDF viewer,
   and it prints as-is.
   ============================================================ */
#cv{
  position:fixed; inset:0; z-index:45;               /* under the nav, over her */
  overflow-y:auto; overscroll-behavior:contain;
  background:var(--paper);
  opacity:0; visibility:hidden;
  transition:opacity .34s ease, visibility 0s linear .34s;
}
#cv.open{opacity:1;visibility:visible;transition:opacity .34s ease}
body.sheet-open{overflow:hidden}

.cv-sheet{
  max-width:1000px;margin-inline:auto;
  padding:clamp(104px,14vh,164px) clamp(20px,5vw,72px) clamp(72px,10vh,120px);
}
/* each block arrives on its own spring, top to bottom */
.cv-sheet > *{
  opacity:0;transform:translateY(30px);
  transition:opacity .55s ease,transform .8s cubic-bezier(.22,1.14,.32,1);
}
#cv.open .cv-sheet > *{opacity:1;transform:none}
#cv.open .cv-sheet > *:nth-child(2){transition-delay:.07s}
#cv.open .cv-sheet > *:nth-child(3){transition-delay:.14s}
#cv.open .cv-sheet > *:nth-child(4){transition-delay:.21s}
#cv.open .cv-sheet > *:nth-child(5){transition-delay:.28s}

.cv-name{
  font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.92;
  font-size:clamp(46px,7.4vw,104px);
}
.cv-role{margin-top:14px;font-size:16px;color:var(--ink-2)}
.cv-intro{
  margin-top:clamp(22px,3.4vh,34px);max-width:60ch;
  font-size:clamp(16px,1.4vw,18.5px);line-height:1.65;color:var(--ink-2);
}
/* no rules under these — a hairline under every link is the tell that gives
   a generated page away. They answer in red on hover instead. */
.cv-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:clamp(22px,3.4vh,34px);font-size:14.5px}
.cv-meta a{color:var(--ink);text-decoration:none;transition:color .25s ease}
.cv-meta a:hover{color:var(--accent)}

.cv-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(26px,4vh,40px)}
.cv-print{
  cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  font-family:var(--ui);font-size:14px;padding:12px 20px;border-radius:13px;
  transition:transform .45s cubic-bezier(.34,1.4,.5,1),background .28s ease,border-color .28s ease;
}
.cv-print:hover{transform:translateY(-2px);background:var(--accent);border-color:var(--accent)}
.cv-print svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.cv-block{
  padding-top:clamp(42px,6vh,72px);margin-top:clamp(42px,6vh,72px);
  border-top:1px solid var(--line);
}
.cv-block .block-h{margin-bottom:clamp(24px,3.6vh,38px)}
.cv-skills{display:grid;gap:clamp(18px,2.6vh,26px)}
.cv-skill-row{
  display:grid;grid-template-columns:minmax(110px,.5fr) minmax(0,2.4fr);
  gap:clamp(12px,3vw,44px);align-items:baseline;
}
.cv-skill-row > b{font-family:var(--ui);font-weight:400;font-size:13px;color:var(--muted)}
.cv-chips{display:flex;flex-wrap:wrap;gap:8px}
.cv-chips i{
  font-style:normal;border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:13.5px;color:var(--ink-2);background:var(--paper-2);
}
.cv-end{text-align:center}
.cv-end .big-cta{margin-top:0;font-size:clamp(38px,7vw,88px)}

/* the way out: a pill clear of the nav on desktop, thumb-height on phones */
.cv-close{
  position:fixed;top:18px;right:clamp(14px,3vw,26px);z-index:52;
  display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:9px 14px 9px 12px;border-radius:14px;border:1px solid var(--line);
  background:rgba(248,246,241,.78);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 6px 24px rgba(23,20,15,.06);
  font-family:var(--ui);font-size:12.5px;color:var(--ink-2);
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity .3s ease,transform .5s cubic-bezier(.34,1.4,.5,1),
             background .25s ease,color .25s ease,border-color .25s ease,visibility 0s linear .3s;
}
body.sheet-open .cv-close{opacity:1;visibility:visible;transform:none;transition-delay:.12s,.12s,0s,0s,0s,0s}
.cv-close:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cv-close svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
/* she comes with you into the CV: the stage rises above the sheet and the
   rig pins her to the docked pose, so it is the same character in the same
   corner rather than a second illustration */
body.sheet-open #stage{z-index:46}

@media (max-width:820px){
  /* on phones she docks bottom-right, so the way out moves to the other side */
  .cv-close{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;right:auto;padding:11px 16px 11px 14px}
  .cv-skill-row{grid-template-columns:1fr;gap:9px}
}

/* ============================================================
   CASE STUDY — a project card opens its own page over the site.
   This one keeps the art direction of Elif's own board: near-black
   ground, coral→pink ramp, heavy uppercase headings, and a layout
   that alternates on purpose — centred where the page speaks in
   its own voice, left-aligned where it argues.
   ============================================================ */
#case{
  position:fixed; inset:0; z-index:45;
  overflow-y:auto; overscroll-behavior:contain;
  background:var(--c-bg); color:var(--c-ink);
  opacity:0; visibility:hidden;
  transition:opacity .34s ease, visibility 0s linear .34s;

  --c-bg:#0F1115;
  --c-bg-2:#121418;
  --c-ink:#EFEAE7;                       /* the few things that are truly white */
  --c-head:#BFBFC3;                      /* section headlines sit back a step */
  --c-body:#8A8B90;
  --c-line:rgba(255,255,255,.08);
  --c-o:#FF7643;                         /* ramp start — also the eyebrow colour */
  --c-p:#FF557D;                         /* ramp end */
  --c-ramp:linear-gradient(96deg,#FF7643,#FF557D);
  --cw:min(1200px,90vw);                 /* her board is 1200 inside 1400 */
}
/* opening is quick on purpose: while the sheet cross-fades, the light site
   shows through a dark page. The arrival is carried by the cover animation
   and the reveals, not by a long fade. */
#case.open{opacity:1;visibility:visible;transition:opacity .18s ease}
.case-sheet{padding-bottom:clamp(60px,9vh,110px)}

/* the character stays on the home page: this sheet has its own voice */
body.case-open #stage{display:none}
/* grain multiplies, which on near-black is the same as switching it off */
body.case-open:not(.case-light) .grain{mix-blend-mode:screen;opacity:.09}

/* ---- shared rhythm ---- */
.cs{padding-inline:clamp(20px,5vw,72px)}
.cs-in{width:var(--cw);margin-inline:auto}
.cs-in.mid{text-align:center}
.cs-sec{padding-block:clamp(56px,9vh,120px)}
.cs-eyebrow{
  font-family:var(--ui);font-size:13.5px;font-weight:500;
  letter-spacing:.13em;text-transform:uppercase;color:var(--c-o);
}
.cs-h{
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(30px,4.6vw,60px);line-height:1.03;letter-spacing:-.012em;
  color:var(--c-head);margin-top:clamp(14px,2vh,22px);max-width:20ch;
}
.cs-in.mid .cs-h{margin-inline:auto}
.cs-body{font-size:clamp(15px,1.25vw,17px);line-height:1.62;color:var(--c-body);max-width:62ch}

/* the warm mesh — bottom-left on the cover, top-left on the gap band, the
   same light source moving through the page rather than two decorations */
.cs-mesh{position:relative;isolation:isolate}
.cs-mesh:before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(126% 104% at -8% 108%, rgba(255,186,158,.72), rgba(255,126,96,.22) 38%, rgba(15,17,21,0) 68%),
    radial-gradient(86% 76% at 24% 112%, rgba(255,104,120,.30), rgba(15,17,21,0) 70%);
}
.cs-mesh.top:before{
  background:
    radial-gradient(126% 104% at -8% -8%, rgba(255,186,158,.62), rgba(255,126,96,.19) 38%, rgba(15,17,21,0) 68%),
    radial-gradient(86% 76% at 22% -12%, rgba(255,104,120,.26), rgba(15,17,21,0) 70%);
}

/* ---- COVER — the pitch, drawn the way the product itself behaves ---- */
.cover{min-height:min(96svh,880px);display:flex;flex-direction:column;justify-content:center;
  padding-block:clamp(90px,12vh,140px) clamp(40px,6vh,70px)}
.cover-top{
  width:var(--cw);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;margin-bottom:clamp(34px,6vh,74px);
}
.cover-kicker{font-family:var(--ui);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#9B9CA1}
.sig{display:flex;align-items:center;gap:14px}
.sig img{width:42px;height:42px;border-radius:50%;display:block;border:1.5px solid var(--c-o)}
.sig span{font-family:var(--ui);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--c-o)}

/* four ghost tiles: the catalogue, present but not the point */
.cover-art{position:relative;width:var(--cw);margin-inline:auto}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.8vw,26px)}
.tiles i{
  display:block;aspect-ratio:.74;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid rgba(255,255,255,.05);
}
.tiles i:nth-child(1){background:linear-gradient(180deg,rgba(255,166,140,.13),rgba(255,255,255,.02))}
.tiles i:nth-child(2){background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.02))}
/* The assistant's two marks — the arrow and the one line it says — ride a
   single rig, so the pair can be handed over to the real pointer inside the
   catalogue and spring back to its parked pose on the way out. The rig has no
   size: its origin is the arrow's tip, which is what the pointer sits at. */
.cover-rig{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.cover-art.live,.cover-art.live *{cursor:none}
.cover-cursor{position:absolute;left:0;top:0;width:clamp(46px,5vw,74px)}
.cover-cursor svg{width:100%;height:auto;display:block;
  filter:drop-shadow(0 6px 18px rgba(255,90,110,.42))}
/* the slot carries the side-flip, the pill carries its own entry animation —
   one transform each, so neither overwrites the other */
.say-slot{position:absolute;left:clamp(30px,3.4vw,50px);top:clamp(30px,3.6vw,52px);width:max-content;
  transition:transform .34s cubic-bezier(.22,1.1,.32,1)}
.cover-rig.flip .say-slot{transform:translateX(calc(-100% - clamp(38px,4vw,60px)))}
.cover-say{
  display:flex;align-items:center;gap:clamp(12px,1.4vw,20px);
  background:#fff;border-radius:999px;padding:clamp(13px,1.5vw,20px) clamp(14px,1.6vw,22px) clamp(13px,1.5vw,20px) clamp(20px,2.2vw,30px);
  box-shadow:0 18px 50px rgba(0,0,0,.42);white-space:nowrap;
  font-family:var(--display);font-weight:600;letter-spacing:-.02em;
  font-size:clamp(15px,1.9vw,27px);color:#15161A;
}
.cover-say b{font-weight:600;background-image:var(--c-ramp);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.cover-say kbd{
  font-family:var(--ui);font-weight:400;font-size:clamp(11px,.95vw,14px);color:#6C6E74;
  border:1px solid rgba(0,0,0,.13);border-radius:9px;padding:6px 11px;background:#F4F3F1;
}
/* the arrow and its line arrive the way they do in the product — the cursor
   lands first, the sentence catches up */
#case.open .cover-cursor{animation:curIn .8s cubic-bezier(.22,1.1,.32,1) both}
#case.open .cover-say{animation:sayIn .7s cubic-bezier(.22,1.3,.36,1) .34s both;transform-origin:0 50%}
/* the picture cover arrives the same way, but on its own — it must never carry
   .rv: the sheet's reveal observer runs while #case is still transitioning in,
   and a cover that misses that pass stays at opacity 0 with nothing to trip it */
#case.open .cover-shot{animation:shotIn .85s cubic-bezier(.22,1.1,.32,1) both}
@keyframes curIn{from{opacity:0;transform:translate(-38px,-26px)}to{opacity:1;transform:none}}
@keyframes sayIn{from{opacity:0;transform:scale(.9) translateX(-14px)}to{opacity:1;transform:none}}
@keyframes shotIn{from{opacity:0;transform:translateY(26px) scale(.985)}to{opacity:1;transform:none}}
/* both keyframes start at opacity 0 — without this the cover would simply be
   blank for anyone who has motion turned off */
@media (prefers-reduced-motion:reduce){
  #case.open .cover-cursor,#case.open .cover-say,#case.open .cover-shot{animation:none}
  .rv{opacity:1;transform:none}
  .rung .bar span{transition:none}
}

.cover-foot{width:var(--cw);margin-inline:auto;margin-top:clamp(34px,6vh,72px);
  display:flex;align-items:center;gap:clamp(14px,2vw,26px);flex-wrap:wrap}
.cs-meta{display:flex;gap:20px;flex-wrap:wrap;font-family:var(--ui);font-size:13px;color:#82838A}
.cs-meta b{font-weight:400;color:var(--c-ink)}

/* See demo — the only filled control on the page, so it reads as the one
   thing to press */
.demo-btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;border:0;
  font-family:var(--ui);font-size:14.5px;color:#15161A;background-image:var(--c-ramp);
  padding:14px 22px;border-radius:999px;
  box-shadow:0 10px 30px rgba(255,105,110,.24);
  transition:transform .45s cubic-bezier(.34,1.4,.5,1),box-shadow .3s ease;
}
.demo-btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,105,110,.34)}
.demo-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- the statement, centred: the page's own sentence ---- */
.cs-claim{
  font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.12;
  font-size:clamp(28px,4.3vw,56px);margin-top:clamp(16px,2.4vh,26px);
  background-image:var(--c-ramp);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.cs-lead{font-family:var(--ui);font-size:15px;color:#9B9CA1;letter-spacing:.01em}

/* ---- screens ---- */
.cs-shots{display:grid;gap:clamp(26px,3.4vw,52px);margin-top:clamp(30px,4.4vh,54px)}
.cs-shots.two{grid-template-columns:1fr 1fr}
.cs-shots.mid{width:min(760px,100%);margin-inline:auto}
.cs-shots.tight{width:min(560px,100%)}   /* the gap is a diagram, not a screen */
/* three across for a fork (chose · dropped · risk), four for a survey of
   competitors or a screen tour. Same grid, only the column count changes. */
.cs-shots.three{grid-template-columns:repeat(3,1fr);gap:clamp(20px,2.4vw,38px)}
.cs-shots.four{grid-template-columns:repeat(4,1fr);gap:clamp(18px,2vw,34px)}
.cs-shots.four .cs-cap p,.cs-shots.three .cs-cap p{font-size:14px;line-height:1.55}
/* the source credit under a survey: present, checkable, and not competing
   with the captions above it */
.cs-note{margin-top:clamp(22px,3vh,34px);max-width:70ch;
  font-family:var(--ui);font-size:12.5px;line-height:1.65;color:#7E7A76}
/* the dropped option is the one she did not build: it reads quieter than the
   one she did, so the argument is visible before the captions are read */
.cs-shot.off img{opacity:.68;filter:grayscale(.3)}
.cs-shot.off .cs-cap b,.cs-shot.off .cs-cap p{color:#7E7A76}
/* a cover that is a picture rather than a performance */
.cover-shot{width:var(--cw);margin-inline:auto;display:block;height:auto;
  border-radius:clamp(10px,1.2vw,20px);box-shadow:0 50px 110px rgba(0,0,0,.5)}
/* closing notes: text in three columns, no screens left to show */
.notes{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3.2vw,54px);
  margin-top:clamp(34px,5vh,64px)}
.notes b{display:block;font-family:var(--display);font-weight:800;
  font-size:clamp(19px,1.7vw,23px);letter-spacing:-.015em;color:var(--c-ink);margin-bottom:12px}
.notes i{display:block;font-style:normal;font-family:var(--display);font-weight:800;
  font-size:clamp(28px,3.4vw,42px);line-height:1;letter-spacing:-.03em;
  background-image:var(--c-ramp);-webkit-background-clip:text;background-clip:text;
  color:transparent;margin-bottom:16px}
.notes p{font-size:15px;line-height:1.6;color:var(--c-body)}
.cs-shots img{width:100%;height:auto;display:block;border-radius:clamp(8px,1vw,14px)}
.cs-cap{margin-top:clamp(14px,2vh,20px)}
.cs-cap b{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(15px,1.35vw,18px);letter-spacing:-.005em;color:var(--c-ink);margin-bottom:9px}
.cs-cap.k b{font-family:var(--ui);font-weight:500;font-size:12.5px;letter-spacing:.12em;color:#C9C4C0}
.cs-cap p{font-size:15px;line-height:1.6;color:var(--c-body)}

/* the hover loop, at the width it was recorded. The ramp is a real 2px frame
   here rather than part of the picture, so it stays 2px at every size —
   which is what went wrong when the screens were exported at 1×. */
.cs-play{position:relative;padding:2px;border-radius:calc(clamp(8px,1vw,16px) + 2px);
  background-image:var(--c-ramp);box-shadow:0 40px 90px rgba(0,0,0,.45)}
.cs-play img{width:100%;height:auto;display:block;border-radius:clamp(8px,1vw,16px)}

/* ---- the ladder: her numbers, the bar drawn to the wait ---- */
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,3.2vw,54px);
  margin-top:clamp(34px,5vh,64px)}
.rung b{display:block;font-family:var(--display);font-weight:800;letter-spacing:-.035em;
  font-size:clamp(34px,4.4vw,58px);line-height:1;color:#fff}
.rung .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.10);margin:16px 0 15px;overflow:hidden}
.rung .bar span{display:block;height:100%;border-radius:2px;background-image:var(--c-ramp);
  transform-origin:0 50%;transform:scaleX(0);transition:transform 1s cubic-bezier(.22,1,.3,1) .1s}
.rung.in .bar span{transform:none}
.rung i{font-style:normal;display:block;font-family:var(--ui);font-size:12px;
  letter-spacing:.12em;text-transform:uppercase;color:#C9C4C0;margin-bottom:11px}
.rung p{font-size:14.5px;line-height:1.6;color:var(--c-body)}

/* ---- the sign-off: the name is already on the cover, so the end is the
   thank-you and the two ways on ---- */
.case-end{margin-top:clamp(40px,6vh,74px);display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.case-back{
  cursor:pointer;border:1px solid var(--c-line);background:transparent;
  font-family:var(--ui);font-size:14.5px;color:#9B9CA1;
  padding:13px 22px;border-radius:999px;transition:color .25s ease,border-color .25s ease;
}
.case-back:hover{color:var(--c-ink);border-color:rgba(255,255,255,.28)}

@media (max-width:820px){
  .cs-shots.two,.cs-shots.three,.cs-shots.four{grid-template-columns:1fr}
  .notes{grid-template-columns:1fr;gap:34px}
  .ladder{grid-template-columns:1fr;gap:26px}
  .cs-h{max-width:none}
  /* no pointer to hand the arrow to: the rig collapses and the pair goes back
     to sitting in the flow, the arrow over the tiles, the line beneath them */
  .cover-rig{position:static;transform:none !important}
  .cover-cursor{left:16%;top:24%}
  .say-slot{position:static;transform:none !important;width:auto;margin-top:18px}
  .cover-say{white-space:normal;justify-content:space-between}
}

/* =============================================================
   ALTI — the second case study, and the first one whose board is
   LIGHT. Everything above was written against near-black, but the
   colours were already tokens, so the theme is mostly a new set of
   values plus answers for the handful of rules that had a dark
   ground baked into them. Elif's ALTI board: white and #F7F8FC in
   alternating bands, navy voice, the pink→orange ramp, and exactly
   one dark section — the gap — which is where the argument turns.
   ============================================================= */
#case[data-theme="alti"]{
  --c-bg:#fff;
  --c-bg-2:#F7F8FC;                      /* the board's own second band */
  --c-ink:#0A1551;
  --c-head:#0A1551;                      /* on paper the headline leads, so
                                            it does not sit back the way it
                                            does on black */
  --c-body:#6C73A8;
  --c-line:#E4E8F5;
  --c-o:#FF557B;                         /* ramp start — the eyebrow colour */
  --c-p:#FF751D;
  --c-ramp:linear-gradient(96deg,#FF557B,#FF751D);
  --c-quiet:#9AA2CE;                     /* labels, numbers, the meta line */
}
/* the exported phones carry the band they were drawn on, so the page has to
   paint the same two greys or every screen sits in a visible rectangle */
#case[data-theme="alti"] .cs-sec.alt{background:var(--c-bg-2)}
#case[data-theme="alti"] .cs-lead,
#case[data-theme="alti"] .cover-kicker,
#case[data-theme="alti"] .cs-meta,
#case[data-theme="alti"] .rung i,
#case[data-theme="alti"] .cs-cap.k b{color:var(--c-quiet)}
#case[data-theme="alti"] .rung b{color:var(--c-ink)}
#case[data-theme="alti"] .demo-btn{color:#fff;box-shadow:0 10px 30px rgba(255,85,123,.30)}
#case[data-theme="alti"] .demo-btn:hover{box-shadow:0 16px 40px rgba(255,85,123,.40)}
#case[data-theme="alti"] .case-back{color:var(--c-body);border-color:var(--c-line)}
#case[data-theme="alti"] .case-back:hover{color:var(--c-ink);border-color:#B9C1E8}
/* the same warm light as on the dark sheet, but it has to fade to paper */
#case[data-theme="alti"] .cs-mesh:before{
  background:
    radial-gradient(120% 96% at -6% 112%, rgba(255,85,123,.20), rgba(255,117,29,.10) 40%, rgba(255,255,255,0) 70%),
    radial-gradient(84% 74% at 22% 116%, rgba(255,117,29,.14), rgba(255,255,255,0) 72%);
}

/* =============================================================
   WHALLET — the wallet's own night. The default sheet is the
   Cursor page's warm charcoal with a coral light source, which
   fought every screen on this page: the product is deep navy and
   its one accent runs lavender → pink → orange. Same tokens, the
   board's values, and a mesh that is violet instead of coral.
   ============================================================= */
#case[data-theme="whallet"]{
  --c-bg:#050F2B;                        /* the board's canvas */
  --c-bg-2:#0A1435;                      /* its card surface */
  --c-ink:#FFFFFF;
  --c-head:#FFFFFF;                      /* headlines lead here, they do not sit back */
  --c-body:#8A93C4;
  --c-line:#232A63;
  --c-o:#FF63A1;                         /* ramp middle, and the eyebrow */
  --c-p:#FFAA6C;
  --c-ramp:linear-gradient(96deg,#D4A8FA,#FF63A1 52%,#FFAA6C);
  --c-quiet:#5A64A0;                     /* kickers, meta, the source credit */
}
#case[data-theme="whallet"] .cover-kicker,
#case[data-theme="whallet"] .cs-meta,
#case[data-theme="whallet"] .cs-lead{color:var(--c-quiet)}
#case[data-theme="whallet"] .case-back{border-color:var(--c-line)}
/* the light source moves with the page, the way the coral one does — but the
   fade-out has to land on this ground, not on #0F1115, or it greys out */
#case[data-theme="whallet"] .cs-mesh:before{
  background:
    radial-gradient(126% 104% at -8% 108%, rgba(101,82,254,.60), rgba(137,137,255,.22) 40%, rgba(5,15,43,0) 70%),
    radial-gradient(86% 76% at 28% 112%, rgba(255,99,161,.26), rgba(5,15,43,0) 70%);
}
#case[data-theme="whallet"] .cs-mesh.top:before{
  background:
    radial-gradient(126% 104% at -8% -8%, rgba(101,82,254,.52), rgba(137,137,255,.19) 40%, rgba(5,15,43,0) 70%),
    radial-gradient(86% 76% at 26% -12%, rgba(255,99,161,.22), rgba(5,15,43,0) 70%);
}

/* =============================================================
   REMOTE CONTROLLER (THY) — the deck this page is built from is
   drawn on WHITE end to end, with one red (#C81800, her value,
   not the airline's #E81932) and one charcoal: #2D2D2D, the body
   of the controller itself. So unlike ALTI there is no second
   band to alternate — `alt` is unused here on purpose, and the
   one dark section is the gap, painted the controller's own
   charcoal rather than a colour invented for the page.
   ============================================================= */
#case[data-theme="thy"]{
  --c-bg:#FFFFFF;
  --c-bg-2:#F6F3F3;                      /* the warm grey wash off her slides */
  --c-ink:#1A1514;
  --c-head:#1A1514;                      /* on paper the headline leads */
  --c-body:#6E6663;
  --c-line:#EBE4E3;
  --c-o:#C81800;                         /* every heading on her deck */
  --c-p:#FF5C2E;
  --c-ramp:linear-gradient(96deg,#C81800,#FF5C2E);
  --c-quiet:#A49B99;
}
#case[data-theme="thy"] .cs-sec.alt{background:var(--c-bg-2)}
#case[data-theme="thy"] .cs-lead,
#case[data-theme="thy"] .cover-kicker,
#case[data-theme="thy"] .cs-meta,
#case[data-theme="thy"] .cs-cap.k b{color:var(--c-quiet)}
#case[data-theme="thy"] .case-back{color:var(--c-body);border-color:var(--c-line)}
#case[data-theme="thy"] .case-back:hover{color:var(--c-ink);border-color:#D9CFCD}
/* the numerals and the dots between the stats are navy in ALTI's sheet */
#case[data-theme="thy"] .rows i,
#case[data-theme="thy"] .stats span+span:before{color:#DCD3D1}
/* the cover is a white slide on a white page, so it needs an edge rather than
   the deep shadow the dark sheets drop behind it */
#case[data-theme="thy"] .cover-shot{
  border:1px solid var(--c-line);box-shadow:0 30px 70px -40px rgba(26,21,20,.45);
}
#case[data-theme="thy"] .cs-mesh:before{
  background:
    radial-gradient(120% 96% at -6% 112%, rgba(200,24,0,.13), rgba(255,92,46,.07) 42%, rgba(255,255,255,0) 72%),
    radial-gradient(84% 74% at 24% 116%, rgba(255,92,46,.10), rgba(255,255,255,0) 72%);
}
#case[data-theme="thy"] .cs-mesh.top:before{
  background:
    radial-gradient(120% 96% at -6% -12%, rgba(200,24,0,.12), rgba(255,92,46,.06) 42%, rgba(255,255,255,0) 72%),
    radial-gradient(84% 74% at 22% -16%, rgba(255,92,46,.09), rgba(255,255,255,0) 72%);
}
/* the gap band: the controller's charcoal, lit by its own red */
#case[data-theme="thy"] .cs-sec.band{background:#2D2D2D}
#case[data-theme="thy"] .cs-sec.band:before{
  background:
    radial-gradient(70% 120% at 50% 50%, rgba(200,24,0,.34), rgba(45,45,45,0) 68%),
    radial-gradient(50% 90% at 86% 8%, rgba(255,92,46,.18), rgba(45,45,45,0) 70%);
}
#case[data-theme="thy"] .cs-sec.band .cs-eyebrow{color:#FF7A5C}
#case[data-theme="thy"] .band-p{color:#C6BFBD}

/* ---- the cover: her photograph, the type over it ---- */
.alti-cover{
  position:relative;overflow:hidden;isolation:isolate;
  min-height:min(96svh,880px);display:flex;flex-direction:column;justify-content:space-between;
  padding-block:clamp(84px,11vh,132px) clamp(34px,5vh,60px);color:#fff;
}
.alti-cover .cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.alti-cover:before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(58% 56% at 68% 42%, rgba(255,85,123,.32), rgba(10,21,81,0) 68%),
    linear-gradient(180deg, rgba(10,21,81,.88), rgba(10,21,81,.74) 42%, rgba(5,12,51,.96));
}
.alti-cover .cover-top,.alti-cover .cover-foot{position:relative}
.alti-cover .cover-kicker{color:rgba(255,255,255,.72)}
.alti-cover .sig span{color:#fff}
.alti-cover .sig .eu{
  width:44px;height:44px;border-radius:50%;border:1.5px solid var(--c-o);
  display:grid;place-items:center;font-family:var(--ui);font-size:13px;letter-spacing:.06em;color:#fff;
}
.alti-copy{position:relative;width:var(--cw);margin-inline:auto;padding-block:clamp(28px,6vh,60px)}
.alti-eyebrow{font-family:var(--ui);font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.72)}
.alti-word{
  font-family:var(--display);font-weight:800;letter-spacing:.02em;line-height:.92;
  font-size:clamp(62px,11vw,140px);margin:clamp(10px,1.6vh,18px) 0 clamp(20px,3.4vh,38px);color:#fff;
}
.alti-sub{font-family:var(--display);font-weight:600;letter-spacing:-.01em;
  font-size:clamp(21px,2.4vw,32px);
  background-image:var(--c-ramp);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;}
.alti-line{margin-top:12px;font-family:var(--ui);font-size:14.5px;color:rgba(255,255,255,.66)}
/* the viewfinder: the product's own gesture, sitting where the photograph
   leaves room for it. It is decoration, so it goes when the column narrows. */
.alti-scan{position:absolute;right:6%;top:38%;transform:translateY(-50%);width:min(300px,26vw);
  z-index:-1;opacity:.95}
.alti-cover .cover-foot{margin-top:0}
.alti-cover .cs-meta{color:rgba(255,255,255,.62)}
.alti-cover .cs-meta b{color:#fff}
@media (max-width:900px){.alti-scan{display:none}}

/* ---- research: four people, then the sentence they turned into ---- */
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(14px,1.6vw,24px);
  margin-top:clamp(28px,4vh,44px)}
.pcard{border:1px solid var(--c-line);border-radius:16px;padding:clamp(18px,1.8vw,24px)}
.pcard.pro{background:var(--c-bg-2)}     /* the two who tell the stories */
.pcard .tick{display:block;width:22px;height:3px;border-radius:2px;background:#C8CEED;margin-bottom:16px}
.pcard.pro .tick{background-image:var(--c-ramp);background-color:transparent}
.pcard i{font-style:normal;display:block;font-family:var(--ui);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--c-quiet);margin-bottom:9px}
.pcard.pro i{color:var(--c-o)}
.pcard b{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;
  color:var(--c-ink);margin-bottom:14px}
.pcard p{font-size:14px;line-height:1.6;color:var(--c-body)}
.intent{display:flex;gap:0;margin-top:clamp(30px,4.6vh,54px);border-radius:0 14px 14px 0;overflow:hidden}
.intent:before{content:'';flex:0 0 4px;background-image:var(--c-ramp)}
.intent p{margin:0;padding:clamp(22px,2.6vw,34px);background:var(--c-bg-2);
  font-family:var(--display);font-weight:600;letter-spacing:-.012em;
  font-size:clamp(17px,1.7vw,23px);line-height:1.45;color:var(--c-ink)}

/* ---- the gap: the one dark band, full-bleed, where the page turns ----
   Kept on `.cs-sec.band`, not `.band`: the home page's discipline marquee is
   already called `.band`, further up this stylesheet, and a bare rule here
   wins on order and paints the strip navy. */
.cs-sec.band{
  position:relative;isolation:isolate;color:#fff;text-align:center;
  background:#0A1551;overflow:hidden;
}
.cs-sec.band:before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(70% 120% at 50% 50%, rgba(255,85,123,.26), rgba(10,21,81,0) 68%),
    radial-gradient(50% 90% at 86% 8%, rgba(255,117,29,.16), rgba(10,21,81,0) 70%);
}
.cs-sec.band .cs-eyebrow{color:var(--c-o)}
.band-q{
  font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.28;
  font-size:clamp(22px,2.9vw,38px);color:#fff;margin:clamp(16px,2.4vh,26px) auto 0;max-width:24ch;
}
.band-lab{margin-top:clamp(34px,6vh,64px);font-family:var(--ui);font-size:12.5px;
  letter-spacing:.2em;text-transform:uppercase;color:#fff}
.band-p{margin-top:14px;font-size:clamp(15px,1.35vw,18px);line-height:1.62;
  color:#B9C1E8;max-width:46ch;margin-inline:auto}

/* ---- the trio: three speeds, and later the fork the project turned on ---- */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(24px,4vw,80px);
  margin-top:clamp(34px,5vh,64px)}
.ti .ico{display:block;width:60px;height:60px;margin-bottom:26px}
.ti h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:clamp(26px,2.9vw,38px);line-height:1;letter-spacing:-.02em;color:var(--c-ink)}
.ti .rule{display:block;height:5px;border-radius:3px;background-image:var(--c-ramp);
  margin:clamp(18px,2.4vh,26px) 0 clamp(14px,1.8vh,20px);
  transform-origin:0 50%;transform:scaleX(0);transition:transform .9s cubic-bezier(.22,1,.3,1) .1s}
.ti.in .rule{transform:none}
.ti i{font-style:normal;display:block;font-family:var(--ui);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c-o);margin-bottom:14px}
.ti p{font-size:15px;line-height:1.6;color:var(--c-body)}
/* the road not taken reads quieter than the one she built, so the fork is
   visible before a word of it is read */
.ti.off h3{color:#A8B0D8}
.ti.off .rule{background-image:none;background-color:#D8DDF0}
.ti.off i{color:var(--c-quiet)}

/* ---- a flow, end to end: five phones at walking pace ---- */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(14px,1.7vw,26px);
  margin-top:clamp(30px,4.4vh,52px)}
.flow figure{margin:0}
.flow img{width:100%;height:auto;display:block}
.flow b{display:block;font-family:var(--display);font-weight:800;font-size:15px;
  letter-spacing:-.01em;color:var(--c-o);margin:16px 0 7px}
.flow p{margin:0;font-size:13.5px;line-height:1.55;color:var(--c-body)}

/* ---- looking back: numbered, stacked, no screens left to show ---- */
.rows{margin-top:clamp(30px,4.4vh,52px);display:grid;gap:clamp(24px,3.4vh,38px)}
.rows .row{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,2.4vw,34px);align-items:start}
.rows i{font-style:normal;font-family:var(--display);font-weight:800;font-size:clamp(22px,2.2vw,28px);
  line-height:1;letter-spacing:-.02em;color:#C8CEED}
.rows b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(17px,1.6vw,20px);
  letter-spacing:-.01em;color:var(--c-ink);margin-bottom:9px}
.rows p{margin:0;font-size:15px;line-height:1.62;color:var(--c-body);max-width:76ch}

/* ---- the information architecture, rebuilt rather than screenshotted ----
   On the deck this is a diagram of chips; exported it would be an image of
   type, unreadable on a phone and invisible to search. As markup it reflows,
   it stays selectable, and the grouping — one column per intent — is carried
   by the layout instead of by a picture of a layout. */
.ia{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.1vw,16px);
  margin-top:clamp(32px,4.6vh,56px);align-items:start}
.ia-col{display:grid;gap:8px}
.ia-col b{
  font-family:var(--ui);font-weight:500;font-size:12.5px;letter-spacing:.02em;
  color:#fff;background:var(--c-o);border-radius:9px;padding:13px 12px;text-align:center;
}
.ia-col span,.ia-col i{
  font-style:normal;font-family:var(--ui);font-size:12px;letter-spacing:.01em;
  border-radius:9px;padding:11px 12px;text-align:center;
}
.ia-col span{background:#2D2D2D;color:#fff}          /* the controller's own body */
.ia-col i{background:var(--c-bg-2);color:var(--c-body);border:1px solid var(--c-line)}
/* the leaf keys hang off the level above them, so the indent is the diagram */
.ia-sub{display:grid;gap:6px;margin-left:14px;padding-left:12px;
  border-left:1px solid var(--c-line)}

/* ---- the note the page has to carry ---- */
.nda{display:flex;gap:0;margin-top:clamp(8px,1.4vh,18px);
  border-radius:0 16px 16px 0;overflow:hidden}
.nda:before{content:'';flex:0 0 4px;background-image:var(--c-ramp)}
/* flex:1 or it sizes to its content — the ramp rule would then run down the
   side of a box two thirds the width of everything above it */
.nda-in{flex:1;padding:clamp(22px,2.6vw,32px);background:var(--c-bg-2);
  display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2vw,24px);align-items:start}
.nda svg{width:26px;height:26px;fill:none;stroke:var(--c-o);stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.nda b{display:block;font-family:var(--display);font-weight:600;letter-spacing:-.012em;
  font-size:clamp(17px,1.6vw,21px);color:var(--c-ink);margin-bottom:10px}
.nda p{margin:0;font-size:15px;line-height:1.65;color:var(--c-body);max-width:72ch}

/* the count, above the sign-off — what the project actually came to */
.stats{font-family:var(--ui);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--c-quiet);margin-bottom:clamp(26px,4.4vh,54px)}
.stats span+span:before{content:'·';margin:0 12px;color:#C8CEED}

@media (max-width:980px){
  .pcards{grid-template-columns:1fr 1fr}
  .flow{grid-template-columns:repeat(3,1fr);gap:22px}
  .trio{grid-template-columns:1fr;gap:38px}
  .ia{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  .flow{grid-template-columns:1fr 1fr}
  .pcards{grid-template-columns:1fr}
  .rows .row{grid-template-columns:1fr;gap:8px}
  .ia{grid-template-columns:1fr 1fr}
  .nda-in{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ti .rule{transition:none;transform:none}}

/* the nav and the way out follow the sheet into the dark — but only when the
   sheet IS dark. ALTI's board is paper, and the nav belongs to it there. */
body.case-open:not(.case-light) nav{
  background:rgba(28,29,34,.72);border-color:rgba(255,255,255,.10);
  box-shadow:0 6px 24px rgba(0,0,0,.34);
}
body.case-open:not(.case-light) nav .mark{color:var(--paper)}
body.case-open:not(.case-light) nav .mark i{color:#FF7643}
body.case-open:not(.case-light) nav a{color:#B9BABF}
body.case-open:not(.case-light) nav a:hover{background:rgba(255,255,255,.09);color:#fff}
body.case-open:not(.case-light) .lang{background:rgba(255,255,255,.08)}
body.case-open:not(.case-light) .lang button{color:#8A8B90}
body.case-open:not(.case-light) .lang button.on{background:#EFEAE7;color:#15161A}
/* A case study is a page, not a dialog, so it does not get a dismiss button in
   the corner. There are five ways out already — the elif. wordmark, the nav
   links, Escape, "back to the work" at the end, and the browser's own Back,
   which these sheets push state for. The CV keeps its pill: that one really is
   a panel over the page. */
body.case-open .cv-close{display:none}
body.case-open:not(.case-light) .cv-close{
  background:rgba(28,29,34,.74);border-color:rgba(255,255,255,.12);color:#B9BABF;
}
body.case-open:not(.case-light) .cv-close:hover{background:#EFEAE7;color:#15161A;border-color:#EFEAE7}
/* ALTI's cover is a photograph, so the nav still has to clear it: it keeps the
   light chrome but gets a stronger ground than it needs over paper */
body.case-open.case-light nav{background:rgba(255,255,255,.86)}

/* Save as PDF — the sheet is the document, so printing drops
   everything that belongs to the screen and keeps the paper. */
@media print{
  .grain,.glow,#stage,nav,main,#case,.cv-close,.cv-actions{display:none !important}
  body{background:#fff;overflow:visible}
  #cv{position:static;opacity:1 !important;visibility:visible !important;overflow:visible;background:#fff}
  .cv-sheet{max-width:none;padding:0}
  .cv-sheet > *{opacity:1 !important;transform:none !important}
  .cv-block{border-color:rgba(0,0,0,.15)}
  .exp-row,.cv-skill-row{break-inside:avoid}
  .cv-end{display:none}
}
</style>

<!-- ============================================================
     CHARACTER STAGE
     Transparent 3D render, inlined from src/assets/elif-3d.webp.
     A textured lip mesh shapes vowels continuously during dialogue.
     The original portrait remains the idle pose and WebGL fallback.
     ============================================================ -->
<div id="stage">

const projHref = p => (ROUTES && CASES[p.key]) ? `/case/${p.key}/`
                    : (!CASES[p.key] && DEMOS[p.key]) ? DEMOS[p.key] : '#';
const projCta  = p => (!CASES[p.key] && DEMOS[p.key]) ? t().cta_demo : t().cta_tile;
function wireOpen(a,p){

function setIcon(name){
  if(name===currentIco) return;
  currentIco=name;
  const old=icoEl.querySelector('svg:not(.out)');
  if(old){ old.classList.add('out'); setTimeout(()=>old.remove(),520); }
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.innerHTML=ICO[name]||ICO.grid; s.classList.add('in-pre');
  icoEl.appendChild(s);
  const reveal=()=>s.classList.remove('in-pre');
  requestAnimationFrame(()=>requestAnimationFrame(reveal));
  setTimeout(reveal,60); // rAF is throttled when the tab is hidden — don't strand the icon
}

function say(icon,text,delay=0){
  clearTimeout(typeTimer);
  typing=false;
  setIcon(icon);
  sayEl.classList.add('show');
  const start=()=>{
    typing=true; let i=0;
    txtEl.innerHTML='<span class="caret"></span>';
    const step=()=>{
      i++;
      txtEl.innerHTML = text.slice(0,i) + (i<text.length?'<span class="caret"></span>':'');
      const glyph=text[i-1];
      const pause=/[.!?…]/.test(glyph)?210:/[,;:—]/.test(glyph)?110:/\s/.test(glyph)?35:0;
      portraitSpeech.cue(glyph);
      if(i<text.length) typeTimer=setTimeout(step, 32+Math.random()*16+pause);
      else typing=false;
    };
    if(RM){ txtEl.textContent=text; typing=false; return; }
    step();
  };
  // 180ms head start so the icon lands first — then she "speaks"
  typeTimer=setTimeout(start, delay+180);
}

   ============================================================= */
const charEl=document.getElementById('char');
const charFigure=document.getElementById('charFigure');
const charMouth=document.getElementById('charMouth');
/* A small textured lip mesh. The open-mouth render supplies the lip/teeth
   texture; the mesh compresses the mouth cavity and shapes vowels continuously.
   Outside this patch the original portrait is never redrawn or replaced. */
function createPortraitSpeechRig(canvas, source) {
  const size = [244, 172];
  let gl, program, openingUniform, widthUniform;
  let ready = false, failed = false, visible = 0;
  let opening = 0, width = 1, targetOpening = 0, targetWidth = 1;

  function shader(type, text) {
    const result = gl.createShader(type);
    gl.shaderSource(result, text);
    gl.compileShader(result);
    if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) throw new Error('Lip shader failed');
    return result;
  }

  function initialize() {
    if (ready) return;
    try {
      gl = canvas.getContext('webgl', {alpha:true, antialias:false, premultipliedAlpha:false, depth:false});
      if (!gl) { failed = true; canvas.dataset.rig='fallback'; return; }
      program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, `
        attribute vec2 point;
        varying vec2 sourcePoint;
        uniform float opening;
        uniform float mouthWidth;
        void main() {
          vec2 p = vec2(510.0, 450.0) + point * vec2(244.0, 172.0);
          sourcePoint = p;
          float across = 1.0 - smoothstep(58.0, 112.0, abs(p.x - 632.0));
          // Inner mouth collapses into a line; the lower lip keeps its volume.
          float jaw = p.y < 507.0 ? 0.0 : p.y < 528.0 ? p.y - 507.0
                    : 21.0 * (1.0 - smoothstep(528.0, 600.0, p.y));
          p.y -= (1.0 - opening) * jaw * across;
          float aroundLips = exp(-pow((sourcePoint.y - 515.0) / 40.0, 2.0));
          p.x += (p.x - 632.0) * (mouthWidth - 1.0) * aroundLips * across;
          vec2 position = (p - vec2(510.0, 450.0)) / vec2(244.0, 172.0);
          gl_Position = vec4(position.x * 2.0 - 1.0, 1.0 - position.y * 2.0, 0.0, 1.0);
        }
      `));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `
        precision mediump float;
        varying vec2 sourcePoint;
        uniform sampler2D portrait;
        void main() {
          vec4 color = texture2D(portrait, sourcePoint / 1254.0);
          float edge = length((sourcePoint - vec2(632.0, 533.0)) / vec2(117.0, 78.0));
          float feather = 1.0 - smoothstep(0.65, 1.0, edge);
          gl_FragColor = vec4(color.rgb, color.a * feather);
        }
      `));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Lip program failed');
      gl.useProgram(program);
      const vertices = [], rows = 48, columns = 48;
      for (let y = 0; y < rows; y++) for (let x = 0; x < columns; x++) {
        const x0=x/columns, x1=(x+1)/columns, y0=y/rows, y1=(y+1)/rows;
        vertices.push(x0,y0, x0,y1, x1,y0, x1,y0, x0,y1, x1,y1);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
      const point = gl.getAttribLocation(program, 'point');
      gl.enableVertexAttribArray(point);
      gl.vertexAttribPointer(point, 2, gl.FLOAT, false, 0, 0);
      gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
      openingUniform = gl.getUniformLocation(program, 'opening');
      widthUniform = gl.getUniformLocation(program, 'mouthWidth');
      gl.viewport(0, 0, size[0], size[1]);
      ready = true;
      canvas.dataset.rig = 'ready';
    } catch (_) {
      failed = true;
      canvas.style.opacity = '0';
      canvas.dataset.rig = 'fallback';
    }
  }

  source.addEventListener('load', initialize, {once:true});
  if (source.complete && source.naturalWidth) initialize();
  canvas.addEventListener('webglcontextlost', event => {
    event.preventDefault(); ready=false; canvas.style.opacity='0';
  });
  canvas.addEventListener('webglcontextrestored', () => { failed=false; initialize(); });

  return {
    cue(glyph) {
      const c = glyph.toLocaleLowerCase('tr');
      if (/[.!?…,;:—\s]/.test(c)) { targetOpening=0; targetWidth=1; }
      else if (/[mbp]/.test(c)) { targetOpening=0; targetWidth=.97; }
      else if (/[aâ]/.test(c)) { targetOpening=1.08; targetWidth=1.02; }
      else if (/[eê]/.test(c)) { targetOpening=.66; targetWidth=1.08; }
      else if (/[iıîy]/.test(c)) { targetOpening=.36; targetWidth=1.06; }
      else if (/[oö]/.test(c)) { targetOpening=.88; targetWidth=.80; }
      else if (/[uüûw]/.test(c)) { targetOpening=.56; targetWidth=.78; }
      else if (/[fv]/.test(c)) { targetOpening=.14; targetWidth=1; }
      else { targetOpening=Math.max(.18, targetOpening*.78); targetWidth+=(1-targetWidth)*.35; }
    },
    update(dt, speaking, reducedMotion) {
      if (!ready || failed) return;
      if (reducedMotion) {
        visible=opening=targetOpening=0; width=targetWidth=1;
        canvas.style.opacity='0'; return;
      }
      if (!speaking) { targetOpening=0; targetWidth=1; }
      // Lips close faster than they open; vowel widths blend more slowly.
      const close = targetOpening < opening;
      opening += (targetOpening-opening) * -Math.expm1(-dt/(close?38:65));
      width += (targetWidth-width) * -Math.expm1(-dt/85);
      visible += ((speaking?1:0)-visible) * -Math.expm1(-dt/(speaking?65:100));
      if (!speaking && visible < .01) {
        visible=0; canvas.style.opacity='0'; return;
      }
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(openingUniform, Math.max(.015, opening));
      gl.uniform1f(widthUniform, width);
      gl.drawArrays(gl.TRIANGLES, 0, 48*48*6);
      canvas.style.opacity=visible>.995?'1':visible.toFixed(3);
    }
  };
}

const portraitSpeech=createPortraitSpeechRig(charMouth, document.getElementById('charSpeechTexture'));
const glow=document.getElementById('glow');
const cardEl=document.querySelector('.say-card');
let cardW=0;

const CW=720, CH=713;
let mx=.5, my=.5, hx=0, hy=0;                   // cursor + lerped parallax offset
let stripX=0, bandX=0, stripSpeed=1;
let dockP=0, dockPLerp=0;                       // 0 = hero pose, 1 = docked corner
let last=performance.now();

addEventListener('pointermove',e=>{ mx=e.clientX/innerWidth; my=e.clientY/innerHeight; },{passive:true});

function pose(){
  const vw=innerWidth, vh=innerHeight, mobile=vw<820;
  // she rises from the bottom edge and stops below the first word — the
  // headline is the statement, she is not allowed to sit on top of it
  const heroH = mobile ? Math.min(vh*.30,260) : Math.min(vh*.40, 380);
  const dockH = mobile ? 92 : 124;
  const heroS = heroH/CH, dockS = dockH/CH;
  return {
    hero:{x:vw*.5, y:vh*(mobile?.94:1.0), s:heroS},
    // she docks bottom-right, where help lives — and out of the footer's way
    dock:{x:vw-(mobile?62:118), y:vh-22, s:dockS},
    mobile
  };
}

function tick(now){
  const dt=Math.min(34, now-last); last=now;
  const k=1-Math.pow(.001, dt/1000);            // frame-rate independent lerp

  /* ---- dock progress from scroll (pinned while the CV is open) ---- */
  const p=(cvOpen||caseOpen) ? 1 : Math.min(1, Math.max(0, scrollY/(innerHeight*.72)));
  dockP = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2; // easeInOutQuad
  dockPLerp += (dockP-dockPLerp)*k*.9;

  const P=pose();
  const x=P.hero.x+(P.dock.x-P.hero.x)*dockPLerp;
  const y=P.hero.y+(P.dock.y-P.hero.y)*dockPLerp;
  const s=P.hero.s+(P.dock.s-P.hero.s)*dockPLerp;
  charEl.style.transform=`translate3d(${(x-CW/2).toFixed(1)}px,${(y-CH).toFixed(1)}px,0) scale(${s.toFixed(4)})`;
  glow.style.opacity = (1-dockPLerp*.85).toFixed(3);

  /* ---- dialogue follows her ---- */
  if(typing || cardW===0) cardW = Math.max(cardEl.offsetWidth, chipsEl.offsetWidth); // grows while she types
  let sx,sy;
  const sayH=sayEl.offsetHeight, half=(CW*s)/2;
  if(dockPLerp>.5){
    // docked bottom-right: the card opens to her left, like a helper would
    sx = x - half - cardW - 14;
    sy = y - CH*s*.92;
    sayEl.classList.add('flip');
  }else{
    sx = P.mobile ? x-cardW/2 : x+half+18;
    sy = P.mobile ? y-CH*s-sayH-14 : y-CH*s*.78;
    sayEl.classList.remove('flip');
  }
  sx=Math.max(10, Math.min(sx, innerWidth-cardW-14));
  sy=Math.max(74, Math.min(sy, innerHeight-sayH-16));
  sayEl.style.transform=`translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0)`;

  /* ---- continuous vowel shapes, settled lips between words ---- */
  const speaking=typing && !RM && !document.hidden && !caseOpen;
  portraitSpeech.update(dt, speaking, RM);
  speechBlend+=((speaking?1:0)-speechBlend)*k;

  const tx=RM?0:(mx-.5)*(P.mobile?5:12), ty=RM?0:(my-.5)*(P.mobile?3:7);
  hx+=(tx-hx)*k*.55; hy+=(ty-hy)*k*.55;
  const br  = RM?0:Math.sin(now/1450)*1.7;
  const nod = Math.sin(now/340)*.7*speechBlend;
  const tilt = hx*.06;
  charFigure.style.transform = RM?'none':
    `translate3d(${hx.toFixed(2)}px, ${(hy+br+nod).toFixed(2)}px, 0)`+
    ` rotate(${tilt.toFixed(2)}deg) scale(${(1+br*.0016).toFixed(4)})`;

  /* ---- strips drift ---- */
  if(!RM){
    stripX -= (dt/1000)*34*stripSpeed;
    const half=track.scrollWidth/2;
    if(half>0 && -stripX>=half) stripX+=half;
    track.style.transform=`translate3d(${stripX.toFixed(1)}px,0,0)`;

    bandX += (dt/1000)*22;
    const bhalf=band.scrollWidth/3;
    if(bhalf>0 && bandX>=bhalf) bandX-=bhalf;
    band.style.transform=`translate3d(${(-bhalf+bandX).toFixed(1)}px,0,0)`;
  }
  requestAnimationFrame(tick);
}

/* word-by-word statement reveal */
function splitStatement(){
  const el=document.getElementById('statement');
  const html=t().about_statement;
  el.innerHTML=html;
  const walk=n=>{
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3){
        const frag=document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(w=>{
          if(!w.trim()){ frag.appendChild(document.createTextNode(w)); return; }
          const s=document.createElement('w'); s.textContent=w; frag.appendChild(s);
        });
        c.replaceWith(frag);
      } else if(c.nodeType===1) walk(c);
    });
  };
  walk(el);
  [...el.querySelectorAll('w')].forEach((w,i)=>w.style.transitionDelay=(i*42)+'ms');
  const o=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ el.classList.add('in'); o.disconnect(); } }),
    {rootMargin:'0px 0px -18% 0px'});
  o.observe(el);
}

let cvLineTimer=null;
function cvLines(){
  clearTimeout(cvLineTimer);
  sayLine('cv1'); renderChips([]);
  cvLineTimer=setTimeout(()=>{ if(cvOpen) sayLine('cv2'); }, 4200);
}
function resumeLine(){
  if(scrollY<innerHeight*.6){ sayLine('hero1'); return; }
  if(zone) sayLine(zone==='contact'?'end':zone);
}

function openCV(){
  if(cvOpen) return;
  closeCase();
  cvOpen=true; buildCV();
  cvEl.scrollTop=0;
  document.body.classList.add('cv-open','sheet-open');
  cvEl.setAttribute('aria-hidden','false');
  navAbout.setAttribute('aria-current','page');
  cvLines();
  // the class lands on the next frame so the blocks animate in rather
  // than appearing already settled
  requestAnimationFrame(()=>cvEl.classList.add('open'));
  syncRoute();
}
function closeCV(){
  if(!cvOpen) return;
  cvOpen=false;
  clearTimeout(cvLineTimer);
  cvEl.classList.remove('open');
  document.body.classList.remove('cv-open','sheet-open');
  cvEl.setAttribute('aria-hidden','true');
  navAbout.removeAttribute('aria-current');
  navAbout.focus({preventScroll:true});
  resumeLine();
  syncRoute();
}
navAbout.addEventListener('click',e=>{ e.preventDefault(); cvOpen ? closeCV() : openCV(); });
/* the wordmark goes home from wherever you are: it closes whichever sheet is
   open (which puts the address back to /) and returns to the top. Handled in
   JS rather than left to the href so a case study folds away instead of the
   browser reloading the whole page under it. */
navHome.addEventListener('click',e=>{
  e.preventDefault();
  closeCV(); closeCase();
  scrollTo({top:0,behavior:RM?'auto':'smooth'});
});
